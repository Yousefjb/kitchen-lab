<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe9d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مختبر المطبخ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="لعبة طبخ للأطفال: امزج المكوّنات في الوعاء السحري واكتشف الأطباق والملصقات.">
<title>مختبر المطبخ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<noscript>🍳 تحتاج لعبة مختبر المطبخ إلى تفعيل جافاسكربت.</noscript>

<div class="start" id="startScreen">
  <div class="start-card">
    <div class="start-logo emo" id="startLogo" aria-hidden="true">🍳</div>
    <h1>مختبر المطبخ</h1>
    <p id="startMode">مطبخ كل يوم</p>
    <button class="play-btn" id="btnPlay">▶ هيّا نطبخ!</button>
  </div>
</div>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo emo" id="brandLogo" aria-hidden="true">🍳</span>
      <span class="brand-text">
        <span class="title">مختبر المطبخ</span>
        <small id="brandMode">مطبخ كل يوم</small>
      </span>
    </div>
    <div class="actions">
      <button class="pill" id="btnBook" aria-label="ألبوم الملصقات"><span class="emo" aria-hidden="true">📒</span><span class="pill-label">ملصقاتي</span><span class="dot" id="bookDot" hidden></span></button>
      <button class="icon-btn" id="btnParents" aria-label="ركن الكبار" title="ركن الكبار"><span class="emo">🔒</span></button>
    </div>
  </header>

  <main class="station" id="station">
    <div class="order" id="order" hidden>
      <span class="order-cust emo" id="orderCust" aria-hidden="true">🐻</span>
      <button class="order-bubble" id="orderBubble">
        <span class="order-who" id="orderWho"></span>
        <span class="order-want"><span class="emo" id="orderEmo"></span><span id="orderName"></span></span>
      </button>
      <span class="order-stars" id="orderStars"><span class="emo" aria-hidden="true">⭐</span><b id="starCount">٠</b></span>
      <button class="order-skip" id="orderSkip" aria-label="زبون آخر" title="زبون آخر">↻</button>
    </div>
    <div class="dropzone" id="dropzone">
      <div class="slots" id="slots">
        <!-- one .slot per bowl space (the kitchen's `bowl` size), added by js/main.js -->
        <button class="empty-btn" id="btnEmpty" aria-label="أفرغ الوعاء" title="أفرغ الوعاء" hidden>↺</button>
      </div>
      <div class="bowl-area" id="bowlArea">
        <div class="bowl-wrap" id="bowlWrap" data-face="idle" role="button" tabindex="0" aria-label="طبّوخ، اضغط عليه ليساعدك">
          <svg class="bowl-svg" id="bowlSvg" viewBox="0 0 260 215" aria-hidden="true">
            <defs>
              <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffd3e0"/>
                <stop offset=".55" stop-color="#ffa2bf"/>
                <stop offset="1" stop-color="#f27aa1"/>
              </linearGradient>
              <linearGradient id="gInner" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#d4507b"/>
                <stop offset="1" stop-color="#f58bad"/>
              </linearGradient>
              <clipPath id="liquidClip">
                <ellipse cx="130" cy="88" rx="98" ry="20"/>
              </clipPath>
            </defs>
            <ellipse cx="130" cy="206" rx="86" ry="9" fill="#4a2c1d" opacity=".14"/>
            <ellipse cx="130" cy="80" rx="112" ry="28" fill="url(#gInner)"/>
            <g class="liquid">
              <ellipse class="liquid-fill" cx="130" cy="88" rx="98" ry="20"/>
              <!-- the stirring swirl, drawn by js/stir.js: a circle squashed onto the liquid -->
              <g class="swirl" clip-path="url(#liquidClip)">
                <g transform="translate(130 88) scale(1 .204)">
                  <g class="swirl-spin"></g>
                </g>
                <ellipse class="swirl-blend" cx="130" cy="88" rx="98" ry="20"/>
                <g transform="translate(130 88) scale(1 .204)">
                  <g class="swirl-shine">
                    <path d="M8 0 C30 -30 70 -20 78 20 C84 55 50 88 10 96" vector-effect="non-scaling-stroke"/>
                    <path d="M-8 0 C-30 30 -70 20 -78 -20 C-84 -55 -50 -88 -10 -96" vector-effect="non-scaling-stroke"/>
                  </g>
                </g>
              </g>
              <ellipse cx="108" cy="83" rx="42" ry="7" fill="#fff" opacity=".35"/>
              <g class="bubbles">
                <circle cx="96" cy="92" r="4.5"/>
                <circle cx="142" cy="94" r="3.5"/>
                <circle cx="168" cy="88" r="5"/>
                <circle cx="120" cy="87" r="3"/>
              </g>
            </g>
            <g class="spoon">
              <path d="M128 96 L172 4" stroke="#a86b3c" stroke-width="12" stroke-linecap="round"/>
              <path d="M128 96 L172 4" stroke="#d9a06b" stroke-width="5" stroke-linecap="round"/>
              <ellipse cx="124" cy="102" rx="17" ry="10" fill="#a86b3c"/>
            </g>
            <path d="M18 80 C18 150 58 200 130 200 C202 200 242 150 242 80 A112 28 0 0 1 18 80 Z" fill="url(#gBody)"/>
            <ellipse cx="130" cy="80" rx="112" ry="28" fill="none" stroke="#ffe6ee" stroke-width="7"/>
            <g fill="#fff" opacity=".5">
              <circle cx="46" cy="116" r="6"/><circle cx="214" cy="116" r="6"/>
              <circle cx="70" cy="170" r="5"/><circle cx="190" cy="170" r="5"/>
              <circle cx="130" cy="190" r="4"/>
            </g>
            <path d="M40 104 C44 140 64 168 92 184" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".45"/>
            <g class="cheeks" fill="#ff4f86" opacity=".32">
              <ellipse cx="80" cy="154" rx="11" ry="6.5"/><ellipse cx="180" cy="154" rx="11" ry="6.5"/>
            </g>
            <g class="f f-idle" fill="#4a2c1d">
              <g class="eyes">
                <ellipse cx="100" cy="138" rx="7" ry="9"/><ellipse cx="160" cy="138" rx="7" ry="9"/>
                <circle cx="102.5" cy="134.5" r="2.6" fill="#fff"/><circle cx="162.5" cy="134.5" r="2.6" fill="#fff"/>
              </g>
              <path class="mouth" d="M118 157 Q130 167 142 157" stroke="#4a2c1d" stroke-width="4" fill="none" stroke-linecap="round"/>
            </g>
            <g class="f f-happy">
              <path d="M91 142 Q100 129 109 142 M151 142 Q160 129 169 142" stroke="#4a2c1d" stroke-width="5" fill="none" stroke-linecap="round"/>
              <g class="mouth">
                <path d="M112 152 Q130 180 148 152 Z" fill="#7a2b3b"/>
                <path d="M121 163 Q130 158 139 163 Q130 172 121 163 Z" fill="#ff7f9f"/>
              </g>
            </g>
            <g class="f f-wow" fill="#4a2c1d">
              <circle cx="100" cy="137" r="10"/><circle cx="160" cy="137" r="10"/>
              <circle cx="103" cy="133" r="3.5" fill="#fff"/><circle cx="163" cy="133" r="3.5" fill="#fff"/>
              <ellipse class="mouth" cx="130" cy="162" rx="7" ry="9" fill="#7a2b3b"/>
            </g>
            <g class="f f-dizzy">
              <g class="eyes" stroke="#4a2c1d" stroke-width="4.5" stroke-linecap="round">
                <path d="M92 131 L108 145 M108 131 L92 145"/>
              </g>
              <g class="eyes" stroke="#4a2c1d" stroke-width="4.5" stroke-linecap="round">
                <path d="M152 131 L168 145 M168 131 L152 145"/>
              </g>
              <path class="mouth" d="M110 162 q5 -7 10 0 t10 0 t10 0 t10 0" stroke="#4a2c1d" stroke-width="4" fill="none" stroke-linecap="round"/>
            </g>
            <g class="f f-meh">
              <path d="M92 139 h16 M152 139 h16" stroke="#4a2c1d" stroke-width="5" stroke-linecap="round"/>
              <path class="mouth" d="M119 163 L141 158" stroke="#4a2c1d" stroke-width="4" stroke-linecap="round"/>
              <path d="M186 118 q6 10 0 14 q-6 -4 0 -14 Z" fill="#8fd3ff"/>
            </g>
          </svg>
        </div>
        <div class="stove" aria-hidden="true">
          <div class="flames"><i class="flame"></i><i class="flame"></i><i class="flame"></i></div>
        </div>
        <!-- cooking after the stir (js/cook.js): tap the pan, pot or oven while the needle is on the star.
             data-how on #cook shows one vessel; the *-front drawings sit in front of the food. -->
        <div class="cook" id="cook" hidden>
          <div class="cook-meter" aria-hidden="true">
            <span class="cook-star emo">⭐</span>
            <i class="cook-needle"></i>
          </div>
          <button class="cook-btn" id="cookBtn">
            <svg class="vessel v-fry" viewBox="0 0 300 150" aria-hidden="true">
              <ellipse cx="185" cy="136" rx="96" ry="10" fill="#4a2c1d" opacity=".14"/>
              <rect x="6" y="62" width="92" height="20" rx="10" fill="#a86b3c"/>
              <rect x="14" y="67" width="66" height="6" rx="3" fill="#d9a06b" opacity=".7"/>
              <rect x="84" y="64" width="26" height="16" rx="5" fill="#2b2b33"/>
              <ellipse cx="185" cy="92" rx="110" ry="44" fill="#2b2b33"/>
              <ellipse cx="185" cy="78" rx="110" ry="44" fill="#474752"/>
              <ellipse cx="185" cy="80" rx="94" ry="35" fill="#5d5d6a"/>
              <ellipse class="cook-oil" cx="185" cy="82" rx="80" ry="27"/>
              <path d="M112 70 Q140 52 182 50" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".22"/>
            </svg>
            <svg class="vessel v-boil" viewBox="0 0 300 170" aria-hidden="true">
              <ellipse cx="150" cy="162" rx="100" ry="8" fill="#4a2c1d" opacity=".14"/>
              <rect x="24" y="66" width="42" height="16" rx="8" fill="#b8403a"/>
              <rect x="234" y="66" width="42" height="16" rx="8" fill="#b8403a"/>
              <ellipse cx="150" cy="60" rx="100" ry="26" fill="#f07a70"/>
              <ellipse cx="150" cy="62" rx="90" ry="21" fill="#7a2b2b"/>
              <ellipse class="cook-liquid" cx="150" cy="66" rx="86" ry="18"/>
            </svg>
            <svg class="vessel v-bake" viewBox="0 0 220 200" aria-hidden="true">
              <defs>
                <radialGradient id="gOvenGlow" cx=".5" cy=".75" r=".75">
                  <stop offset="0" stop-color="#ffd36b"/>
                  <stop offset=".55" stop-color="#ff8a3d"/>
                  <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <ellipse cx="110" cy="194" rx="92" ry="6" fill="#4a2c1d" opacity=".14"/>
              <rect x="24" y="178" width="20" height="14" rx="5" fill="#8a5a3a"/>
              <rect x="176" y="178" width="20" height="14" rx="5" fill="#8a5a3a"/>
              <rect x="8" y="8" width="204" height="178" rx="24" fill="#ffd9b8"/>
              <path d="M8 50 V32 A24 24 0 0 1 32 8 H188 A24 24 0 0 1 212 32 V50 Z" fill="#ffc08f"/>
              <circle cx="42" cy="29" r="10" fill="#fff" stroke="#e39a63" stroke-width="3"/>
              <path d="M42 21 v8" stroke="#8a5a3a" stroke-width="3" stroke-linecap="round"/>
              <circle cx="76" cy="29" r="10" fill="#fff" stroke="#e39a63" stroke-width="3"/>
              <path d="M76 21 v8" stroke="#8a5a3a" stroke-width="3" stroke-linecap="round"/>
              <rect x="118" y="19" width="74" height="20" rx="7" fill="#4a2c1d"/>
              <circle class="cook-lamp" cx="133" cy="29" r="4.5"/>
              <rect x="146" y="26" width="36" height="6" rx="3" fill="#ffcf3f" opacity=".75"/>
              <rect x="28" y="60" width="164" height="104" rx="20" fill="#eaa877"/>
              <rect x="40" y="70" width="140" height="80" rx="13" fill="#3a2622"/>
              <rect class="cook-glow" x="40" y="70" width="140" height="80" rx="13" fill="url(#gOvenGlow)"/>
              <rect x="50" y="134" width="120" height="4" rx="2" fill="#6e4a3a"/>
              <rect x="64" y="166" width="92" height="10" rx="5" fill="#c9824e"/>
            </svg>
            <svg class="vessel v-melt" viewBox="0 0 300 150" aria-hidden="true">
              <ellipse cx="180" cy="140" rx="86" ry="8" fill="#4a2c1d" opacity=".14"/>
              <rect x="6" y="54" width="100" height="17" rx="8.5" fill="#a86b3c"/>
              <rect x="14" y="59" width="72" height="5" rx="2.5" fill="#d9a06b" opacity=".7"/>
              <ellipse cx="180" cy="60" rx="90" ry="22" fill="#8fd6cc"/>
              <ellipse cx="180" cy="62" rx="81" ry="18" fill="#2f5f5a"/>
              <ellipse class="cook-liquid" cx="180" cy="65" rx="77" ry="15"/>
            </svg>
            <span class="cook-food emo" id="cookFood"></span>
            <svg class="vessel-front v-boil" viewBox="0 0 300 170" aria-hidden="true">
              <defs>
                <linearGradient id="gPot" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#ff8f80"/>
                  <stop offset="1" stop-color="#d9534a"/>
                </linearGradient>
              </defs>
              <path d="M50 60 L60 138 Q63 156 84 156 L216 156 Q237 156 240 138 L250 60 A100 26 0 0 1 50 60 Z" fill="url(#gPot)"/>
              <path d="M50 60 A100 26 0 0 0 250 60" stroke="#ffb3aa" stroke-width="6" fill="none"/>
              <path d="M72 94 Q76 128 94 146" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".35"/>
              <g fill="#fff" opacity=".5"><circle cx="150" cy="120" r="6"/><circle cx="118" cy="128" r="4"/><circle cx="182" cy="128" r="4"/></g>
              <!-- boiling over: foam climbs out past the star, and drips down the pot when it goes too far -->
              <g class="cook-foam" fill="#fff" stroke="#c9d6e2" stroke-width="2.5">
                <g class="foam-drips">
                  <path d="M58 64 v34 a9 9 0 0 0 18 0 v-34 Z"/>
                  <path d="M112 76 v46 a9 9 0 0 0 18 0 v-46 Z"/>
                  <path d="M178 78 v30 a9 9 0 0 0 18 0 v-30 Z"/>
                  <path d="M226 66 v40 a9 9 0 0 0 18 0 v-40 Z"/>
                </g>
                <circle cx="62" cy="58" r="17"/><circle cx="238" cy="58" r="17"/>
                <circle cx="92" cy="50" r="21"/><circle cx="208" cy="50" r="21"/>
                <circle cx="124" cy="44" r="23"/><circle cx="176" cy="44" r="23"/>
                <circle cx="150" cy="40" r="24"/>
                <circle cx="100" cy="72" r="18"/><circle cx="150" cy="78" r="20"/><circle cx="200" cy="72" r="18"/>
                <g fill="#fff" stroke="none"><circle cx="150" cy="60" r="34"/><circle cx="110" cy="62" r="22"/><circle cx="190" cy="62" r="22"/></g>
              </g>
            </svg>
            <svg class="vessel-front v-melt" viewBox="0 0 300 150" aria-hidden="true">
              <defs>
                <linearGradient id="gSaucepan" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#9fe3d9"/>
                  <stop offset="1" stop-color="#4fb3a6"/>
                </linearGradient>
              </defs>
              <path d="M90 60 L97 114 Q100 130 118 130 L242 130 Q260 130 263 114 L270 60 A90 22 0 0 1 90 60 Z" fill="url(#gSaucepan)"/>
              <path d="M90 60 A90 22 0 0 0 270 60" stroke="#d2f5ef" stroke-width="5" fill="none"/>
              <path d="M110 80 Q112 106 126 120" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".35"/>
            </svg>
            <span class="cook-bits" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span class="cook-smoke" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="cook-label"></span>
          </button>
        </div>
        <div class="result-pop" id="resultPop" hidden aria-hidden="true">
          <div class="rays"></div>
          <span class="emo" id="resultEmo"></span>
          <span class="name" id="resultName"></span>
        </div>
      </div>
    </div>
    <p class="caption" id="caption" aria-live="polite"></p>
  </main>

  <section class="pantry" aria-label="المكوّنات">
    <div class="pantry-head">
      <h2>المكوّنات</h2>
      <div class="chips" id="pantryChips" role="toolbar" aria-label="تصفية المكوّنات"></div>
    </div>
    <div class="grid" id="pantryGrid"></div>
  </section>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="modal" id="book" hidden role="dialog" aria-modal="true" aria-labelledby="bookTitle">
  <div class="backdrop" data-close></div>
  <div class="drawer">
    <div class="grab" aria-hidden="true"></div>
    <header class="book-head">
      <div>
        <h2 id="bookTitle">📒 ألبوم الملصقات</h2>
        <p class="book-count" id="bookCount"></p>
      </div>
      <button class="icon-btn" id="bookClose" aria-label="إغلاق" data-close>✕</button>
    </header>
    <div class="progress" aria-hidden="true"><i id="bookBar"></i><span class="goal emo">🏆</span></div>
    <div class="chips book-tabs" id="bookTabs" role="toolbar" aria-label="تصفية الملصقات"></div>
    <div class="book-grid" id="bookGrid"></div>
    <div class="detail" id="detail" hidden>
      <div class="detail-top">
        <button class="soft-btn" id="detailBack">→ رجوع</button>
        <button class="soft-btn" id="detailListen">🔊 استمع</button>
      </div>
      <div class="d-emo emo" id="dEmo"></div>
      <h3 id="dName"></h3>
      <span class="tag" id="dTag"></span>
      <p id="dDesc"></p>
      <div class="d-section" id="dMade"></div>
      <div class="d-section" id="dUses"></div>
    </div>
  </div>
</div>

<div class="modal sheet" id="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="backdrop" data-close></div>
  <div class="drawer">
    <div class="grab" aria-hidden="true"></div>
    <header class="book-head">
      <div>
        <h2 id="gateTitle">🔒 للكبار فقط</h2>
        <p class="book-count">للدخول، اضغط على هذا الرقم:</p>
      </div>
      <button class="icon-btn" aria-label="إغلاق" data-close>✕</button>
    </header>
    <p class="gate-q" id="gateQ"></p>
    <div class="gate-opts" id="gateOpts"></div>
  </div>
</div>

<div class="modal sheet" id="parents" hidden role="dialog" aria-modal="true" aria-labelledby="parentsTitle">
  <div class="backdrop" data-close></div>
  <div class="drawer">
    <div class="grab" aria-hidden="true"></div>
    <header class="book-head">
      <div>
        <h2 id="parentsTitle">👨‍👩‍👧 ركن الكبار</h2>
        <p class="book-count">الإعدادات والتقدّم</p>
      </div>
      <button class="icon-btn" aria-label="إغلاق" data-close>✕</button>
    </header>
    <div class="parents-body">
      <section>
        <h3>المطبخ</h3>
        <div class="mode-list" id="modeList"></div>
      </section>
      <section>
        <h3>الأصوات</h3>
        <div class="setting"><span>🗣️ صوت الراوي</span><button class="switch" id="swVoice" role="switch" aria-checked="true" aria-label="صوت الراوي"></button></div>
        <div class="setting"><span>🔔 المؤثرات الصوتية</span><button class="switch" id="swSfx" role="switch" aria-checked="true" aria-label="المؤثرات الصوتية"></button></div>
        <div class="setting"><span>🎵 الموسيقى</span><button class="switch" id="swMusic" role="switch" aria-checked="false" aria-label="الموسيقى"></button></div>
        <p class="voice-status" id="voiceStatus"></p>
        <button class="soft-btn" id="btnTestVoice">🔊 جرّب الصوت</button>
      </section>
      <section>
        <h3>التقدّم</h3>
        <p id="parentStats"></p>
        <button class="danger" id="btnReset">مسح تقدّم هذا المطبخ</button>
      </section>
      <section>
        <h3>تثبيت اللعبة</h3>
        <p id="installText"></p>
        <button class="soft-btn" id="btnInstall" hidden>📲 ثبّت اللعبة</button>
      </section>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
<script>
  // If the game's code can't load at all (e.g. a typo in a data file), say so instead of a blank screen.
  window.addEventListener('load', () => {
    if (window.kitchenLabStarted) return;
    console.error('[KitchenLab] js/main.js did not start. Run: node tools/check-data.mjs');
    document.body.insertAdjacentHTML('beforeend',
      '<div dir="rtl" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#fff4e6;font:20px system-ui;z-index:3000">🔥 تعذّر تشغيل اللعبة. أعد تحميل الصفحة من فضلك.</div>');
  });
</script>
</body>
</html>
