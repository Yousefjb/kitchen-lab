<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe9d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مختبر المطبخ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="لعبة طبخ للأطفال: امزج المكوّنات في الوعاء السحري واكتشف الأطباق والملصقات.">
<title>مختبر المطبخ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  --bg: #fff4e6;
  --panel: #fffaf3;
  --ink: #4a2c1d;
  --ink-soft: #8a6552;
  --line: #f0d9c4;
  --accent: #ff6f9c;
  --accent-d: #e2517f;
  --caramel: #ffb44c;
  --mint: #5cc9a0;
  --t1: #ffd978;
  --t2: #ffadc6;
  --t3: #b8a4ff;
  --mishap: #9fd67f;
  --legend: #ffcf3f;
  --tile-w: 96px;
  --tile-h: 106px;
  --slot: 88px;
  --rows: 2;
  --side: clamp(250px, 34vw, 400px);
  --header-h: 60px;
  --reserve: 245px;
  --order-h: 80px;
  --cloth: rgba(255, 111, 156, .055);
  --shadow: 0 4px 0 rgba(74, 44, 29, .12), 0 10px 26px rgba(74, 44, 29, .12);
  --font: system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", "Noto Kufi Arabic", Tahoma, "Geeza Pro", sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif;
  color-scheme: light;
}
:root[data-mode="kitchen"] { --cloth: rgba(70, 150, 230, .07); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  background-image:
    linear-gradient(90deg, var(--cloth) 50%, transparent 50%),
    linear-gradient(var(--cloth) 50%, transparent 50%);
  background-size: 48px 48px;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [role="button"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.emo { font-family: var(--emoji); line-height: 1; }

/* ---------- Layout ---------- */
.app > * { min-width: 0; }
.app {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "header" "station" "pantry";
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
@media (orientation: landscape) and (min-width: 560px) {
  .app {
    grid-template-columns: var(--side) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "header header" "pantry station";
  }
}

/* ---------- Header ---------- */
.topbar {
  grid-area: header;
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 14px;
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-text { display: block; min-width: 0; }
.brand .logo { font-size: 34px; animation: logoSpin 6s ease-in-out infinite; }
.brand .title { display: block; font-size: 21px; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; font-size: 13px; font-weight: 600; color: var(--accent-d); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.actions { display: flex; align-items: center; gap: 8px; flex: none; }
.icon-btn, .pill {
  position: relative;
  height: 48px;
  min-width: 48px;
  border: none;
  border-radius: 999px;
  background: #fff;
  box-shadow: 0 3px 0 rgba(74, 44, 29, .14), inset 0 0 0 2px var(--line);
  font-size: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform .12s ease;
}
.icon-btn:active, .pill:active { transform: translateY(2px) scale(.96); }
.pill { padding: 0 12px; gap: 6px; font-size: 16px; font-weight: 700; }
.pill .emo { font-size: 24px; }
.pill .dot { position: absolute; top: 4px; inset-inline-end: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #fff; animation: twinkle 1.4s ease-in-out infinite; }
.pill .dot[hidden] { display: none; }
.pill.bump { animation: bump .6s cubic-bezier(.34, 1.56, .64, 1); }
@media (max-width: 380px) {
  .brand .title { font-size: 18px; }
  .brand .logo { font-size: 28px; }
  .pill-label { display: none; }
}

/* ---------- Station ---------- */
.station {
  grid-area: station;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(4px, 1.2vh, 12px);
  padding: 6px 14px 10px;
  min-height: 0;
  overflow: hidden;
  container-type: size;
}
.station::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 55%, rgba(255, 255, 255, .92), rgba(255, 255, 255, 0) 62%);
  pointer-events: none;
}

/* Customer order */
.order {
  position: relative;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 8px;
  width: min(100%, 460px);
  min-height: 64px;
  padding: 6px 8px;
  border-radius: 24px;
  background: #fff;
  box-shadow: 0 3px 0 rgba(74, 44, 29, .1), inset 0 0 0 2px var(--line);
}
.order[hidden] { display: none; }
.order.enter { animation: orderIn .55s cubic-bezier(.34, 1.56, .64, 1); }
.order.leave { animation: orderOut .35s ease-in forwards; }
.order-cust { font-size: 42px; flex: none; animation: bob 2.4s ease-in-out infinite; }
.order.served .order-cust { animation: hop .5s ease-in-out 3; }
.order.talking .order-cust { animation: hop .45s ease-in-out infinite; }
.order-bubble {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 6px 12px;
  border: none;
  border-radius: 18px;
  background: #fff6e4;
  box-shadow: inset 0 0 0 3px var(--caramel);
  text-align: start;
}
.order-bubble::before {
  content: "";
  position: absolute;
  inset-inline-start: -9px;
  top: 50%;
  translate: 0 -50%;
  border: 9px solid transparent;
  border-inline-start: 0;
  border-inline-end-color: var(--caramel);
}
.order-who { font-size: 13px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.order-want { display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 800; min-width: 0; max-width: 100%; }
.order-want .emo { font-size: 30px; flex: none; }
.order-want #orderName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.order.served .order-bubble { box-shadow: inset 0 0 0 3px var(--mint); background: #effbf5; }
.order-stars { display: flex; align-items: center; gap: 2px; flex: none; font-size: 17px; font-weight: 800; }
.order-stars .emo { font-size: 22px; }
.order-stars.bump { animation: bump .6s cubic-bezier(.34, 1.56, .64, 1); }
.order-skip {
  flex: none;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: #fff;
  box-shadow: inset 0 0 0 2px var(--line);
  font-size: 22px;
  font-weight: 700;
  color: var(--ink-soft);
}

.dropzone {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(2px, 1vh, 10px);
  padding: 8px 14px 0;
  border-radius: 32px;
  transition: background .2s;
}
.dropzone.hover { background: rgba(255, 111, 156, .08); }
.dropzone.reject { animation: shakeX .4s ease; }

.slots { position: relative; display: flex; align-items: center; gap: 10px; z-index: 3; }
.op { font-size: 28px; font-weight: 800; color: var(--ink-soft); }
.slot {
  width: var(--slot);
  height: var(--slot);
  border-radius: 24px;
  border: 3px dashed #e8c3aa;
  background: rgba(255, 255, 255, .65);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  transition: transform .15s, border-color .2s, background .2s;
}
.slot .plus { font-size: 34px; font-weight: 600; color: #e3b99c; }
.dropzone.hover .slot:not(.filled) { border-color: var(--accent); background: #fff; transform: scale(1.06); }
.dropzone.hover .slot:not(.filled) .plus { color: var(--accent); }
.slot.filled { border: none; background: #fff; box-shadow: inset 0 0 0 3px var(--tc, var(--t1)), 0 3px 0 rgba(74, 44, 29, .12); }
.slot.filled .emo { font-size: 38px; animation: slotIn .45s cubic-bezier(.34, 1.56, .64, 1); }
.slot .lbl { font-size: 12px; font-weight: 700; max-width: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot.t2 { --tc: var(--t2); } .slot.t3 { --tc: var(--t3); } .slot.mishap { --tc: var(--mishap); } .slot.legendary { --tc: var(--legend); }
.cooking .slot.filled .emo { animation: suck .55s cubic-bezier(.55, 0, .8, .3) forwards; }
.cooking .slot.filled .lbl { opacity: 0; transition: opacity .2s; }
.empty-btn {
  position: absolute;
  inset-inline-end: -56px;
  top: 50%;
  translate: 0 -50%;
  width: 46px;
  height: 46px;
  border: none;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 3px 0 rgba(74, 44, 29, .14), inset 0 0 0 2px var(--line);
  font-size: 24px;
  font-weight: 700;
}
.empty-btn[hidden] { display: none; }

.bowl-area {
  position: relative;
  width: min(56vmin, 300px);
  width: clamp(120px, min(72cqw, calc((100cqh - var(--reserve)) * 1.1)), 420px);
}
.bowl-wrap { position: relative; z-index: 2; cursor: pointer; transition: transform .2s ease, filter .2s ease; border-radius: 40%; }
.dropzone.hover .bowl-wrap { transform: scale(1.05); filter: drop-shadow(0 0 16px rgba(255, 111, 156, .65)); }
.bowl-svg { display: block; width: 100%; height: auto; overflow: visible; transform-origin: 50% 90%; animation: bob 3.2s ease-in-out infinite; }
.bowl-svg.squish { animation: squish .5s cubic-bezier(.3, 1.6, .5, 1); }
.bowl-svg.giggle { animation: giggle .12s ease-in-out 7; }
.bowl-svg.sneeze { animation: sneeze .8s ease-in-out; }
.cooking .bowl-svg { animation: wobble .22s ease-in-out infinite alternate; }
.bowl-area::before {
  content: "";
  position: absolute;
  inset: -18%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 207, 63, .6), rgba(255, 207, 63, 0) 62%);
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
}
.cooking .bowl-area::before { opacity: 1; animation: glowPulse .5s ease-in-out infinite alternate; }
.liquid { opacity: 0; transition: opacity .35s; }
.bowl-wrap.has-liquid .liquid { opacity: 1; }
.liquid-fill { fill: var(--liquid, #fff3d6); transition: fill .4s; }
.bubbles circle { fill: rgba(255, 255, 255, .8); opacity: 0; transform-box: fill-box; transform-origin: center; }
.cooking .bubbles circle { animation: bubble .6s ease-in infinite; }
.cooking .bubbles circle:nth-child(2) { animation-delay: .15s; }
.cooking .bubbles circle:nth-child(3) { animation-delay: .3s; }
.cooking .bubbles circle:nth-child(4) { animation-delay: .45s; }
.spoon { opacity: 0; transition: opacity .25s; transform-box: view-box; transform-origin: 130px 100px; }
.cooking .spoon { opacity: 1; animation: stir .42s ease-in-out infinite alternate; }
.f { display: none; }
.bowl-wrap[data-face="idle"] .f-idle,
.bowl-wrap[data-face="happy"] .f-happy,
.bowl-wrap[data-face="wow"] .f-wow,
.bowl-wrap[data-face="dizzy"] .f-dizzy,
.bowl-wrap[data-face="meh"] .f-meh { display: inline; }
.f-idle .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
.f-dizzy .eyes { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
.mouth { transform-box: fill-box; transform-origin: center; }
.bowl-wrap.talking .mouth { animation: talk .16s ease-in-out infinite alternate; }

.stove {
  position: relative;
  z-index: 1;
  width: 70%;
  height: 16px;
  margin: -7% auto 0;
  border-radius: 10px;
  background: linear-gradient(#7a5646, #4a2c1d);
  box-shadow: 0 4px 0 rgba(74, 44, 29, .2);
}
.flames { position: absolute; left: 12%; right: 12%; bottom: 55%; display: flex; justify-content: space-between; }
.flame {
  width: 18px;
  height: 26px;
  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: radial-gradient(circle at 50% 72%, #fff7b0 0 18%, #ffb13b 42%, #ff5a36 72%, rgba(255, 90, 54, 0) 74%);
  transform-origin: 50% 100%;
  transform: scale(.4);
  filter: hue-rotate(185deg) saturate(1.4);
  opacity: .75;
  transition: transform .3s, filter .3s;
}
.cooking .flame { filter: none; opacity: 1; animation: flicker .12s ease-in-out infinite alternate; }
.cooking .flame:nth-child(2) { animation-delay: .06s; }

.result-pop {
  position: absolute;
  left: 50%;
  top: 4%;
  translate: -50% 0;
  z-index: 6;
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
}
.result-pop[hidden] { display: none; }
.result-pop .emo { position: relative; font-size: 76px; font-size: clamp(56px, 20cqmin, 112px); filter: drop-shadow(0 6px 0 rgba(74, 44, 29, .15)); }
.result-pop .name {
  position: relative;
  margin-top: -2px;
  padding: 4px 14px;
  border-radius: 999px;
  background: #fff;
  box-shadow: inset 0 0 0 3px var(--tc, var(--t1)), 0 3px 0 rgba(74, 44, 29, .12);
  font-weight: 800;
  font-size: 17px;
  white-space: nowrap;
}
.result-pop.t2 { --tc: var(--t2); } .result-pop.t3 { --tc: var(--t3); } .result-pop.mishap { --tc: var(--mishap); } .result-pop.legendary { --tc: var(--legend); }
.result-pop .rays {
  display: none;
  position: absolute;
  left: 50%;
  top: 38%;
  width: 240%;
  aspect-ratio: 1;
  translate: -50% -50%;
  border-radius: 50%;
  background: repeating-conic-gradient(rgba(255, 207, 63, .5) 0 11deg, rgba(255, 207, 63, 0) 11deg 30deg);
  -webkit-mask: radial-gradient(circle, #000 25%, transparent 68%);
  mask: radial-gradient(circle, #000 25%, transparent 68%);
  animation: spin 7s linear infinite;
}
.result-pop.new .rays { display: block; }
.result-pop.mishap .rays { background: repeating-conic-gradient(rgba(159, 214, 127, .55) 0 11deg, rgba(159, 214, 127, 0) 11deg 30deg); }
.result-pop.show { animation: popUp .7s cubic-bezier(.34, 1.56, .64, 1) both; }
.result-pop.leave { animation: popOut .3s ease forwards; }

/* Mascot speech bubble (the caption) */
.caption {
  position: relative;
  z-index: 3;
  min-height: 2.8em;
  max-width: min(94%, 38ch);
  margin-top: 8px;
  padding: 8px 16px;
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 3px 0 rgba(74, 44, 29, .1), inset 0 0 0 2px var(--line);
  text-align: center;
  font-weight: 700;
  font-size: 16px;
  font-size: clamp(14px, 3.2cqh, 19px);
  line-height: 1.45;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: box-shadow .2s;
}
.caption::before {
  content: "";
  position: absolute;
  top: -10px;
  left: 50%;
  translate: -50% 0;
  border: 10px solid transparent;
  border-top: 0;
  border-bottom-color: #fff;
  filter: drop-shadow(0 -2px 0 var(--line));
}
.caption.flash { animation: captionIn .35s ease; }
.caption.warn { color: var(--accent-d); }
.caption.talking { box-shadow: 0 3px 0 rgba(74, 44, 29, .1), inset 0 0 0 3px var(--mint); }

/* ---------- Pantry ---------- */
.pantry {
  grid-area: pantry;
  position: relative;
  z-index: 4;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 10px 0 calc(8px + env(safe-area-inset-bottom));
  background: var(--panel);
  border-radius: 26px 26px 0 0;
  box-shadow: 0 -6px 22px rgba(74, 44, 29, .1), inset 0 3px 0 var(--line);
}
.pantry-head { display: flex; align-items: center; gap: 10px; padding: 0 14px 8px; min-width: 0; }
.pantry-head h2 { font-size: 17px; font-weight: 800; flex: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; padding: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  min-height: 38px;
  padding: 0 14px;
  border: none;
  border-radius: 999px;
  background: #fff;
  box-shadow: inset 0 0 0 2px var(--line);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-soft);
  white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }

.grid {
  position: relative;
  display: grid;
  gap: 10px;
  padding: 8px 14px 8px;
  min-height: 0;
  grid-auto-flow: column;
  grid-template-rows: repeat(var(--rows), var(--tile-h));
  grid-auto-columns: var(--tile-w);
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-x: contain;
  scroll-snap-type: x proximity;
  scroll-padding: 0 14px;
  scrollbar-width: thin;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent);
  mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent);
}
@media (orientation: portrait) and (min-height: 880px) { :root { --rows: 3; } }
@media (orientation: portrait) and (max-height: 700px) { :root { --rows: 1; } }
@media (orientation: portrait) and (max-height: 620px) { :root { --slot: 70px; --reserve: 225px; --order-h: 66px; } .order { min-height: 54px; } .order-cust { font-size: 34px; } }
@media (max-width: 360px) { :root { --tile-w: 86px; --tile-h: 96px; --slot: 74px; } }

@media (orientation: landscape) and (min-width: 560px) {
  .pantry {
    border-radius: 26px 0 0 0;
    box-shadow: -6px 0 22px rgba(74, 44, 29, .08), inset 3px 0 0 var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .pantry-head { flex-direction: column; align-items: stretch; gap: 8px; }
  .grid {
    flex: 1;
    grid-auto-flow: row;
    grid-template-rows: none;
    grid-template-columns: repeat(auto-fill, minmax(var(--tile-w), 1fr));
    grid-auto-rows: var(--tile-h);
    align-content: start;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    scroll-snap-type: none;
    -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 26px), transparent);
    mask-image: linear-gradient(180deg, #000 calc(100% - 26px), transparent);
    padding-bottom: 26px;
  }
  .toasts { left: calc((100vw - var(--side)) / 2) !important; }
}
@media (orientation: landscape) and (max-height: 480px) {
  :root { --header-h: 50px; --reserve: 190px; --order-h: 60px; --slot: 66px; --tile-h: 92px; --tile-w: 88px; }
  .caption { min-height: 2.2em; padding: 4px 12px; margin-top: 4px; }
  .order { min-height: 50px; padding: 4px 6px; }
  .order-cust { font-size: 30px; }
  .order-who { display: none; }
}

.tile {
  position: relative;
  width: 100%;
  height: 100%;
  min-width: 64px;
  min-height: 64px;
  border: none;
  border-radius: 22px;
  background: #fff;
  box-shadow: inset 0 0 0 3px var(--tc, var(--t1)), 0 3px 0 rgba(74, 44, 29, .12);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 6px 3px;
  cursor: grab;
  scroll-snap-align: start;
  touch-action: pan-x;
  transition: transform .15s ease, opacity .15s ease;
}
@media (orientation: landscape) and (min-width: 560px) { .tile { touch-action: pan-y; } }
.tile .emo { font-size: 46px; pointer-events: none; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .08)); }
.tile .lbl {
  max-width: 100%;
  padding: 0 3px;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  pointer-events: none;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
@media (hover: hover) { .tile:hover { transform: translateY(-2px); } }
.tile:active { cursor: grabbing; }
.tile.lifted { opacity: .3; transform: scale(.9); }
.tile.t2 { --tc: var(--t2); }
.tile.t3 { --tc: var(--t3); }

.tile.coach { animation: hintPulse 1.2s ease-in-out infinite; }

/* ---------- Floating layers ---------- */
.ghost {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 1000;

}

#fx { position: fixed; inset: 0; z-index: 700; pointer-events: none; }
.coach-hand { position: fixed; left: 0; top: 0; z-index: 950; font-size: 46px; pointer-events: none; filter: drop-shadow(0 4px 4px rgba(74, 44, 29, .3)); }

.toasts {
  position: fixed;

  translate: -50% 0;

  pointer-events: none;
}

.toast {
  display: flex;

  gap: 12px;
  padding: 10px 14px;
  border-radius: 20px;

}
.toast.out { animation: toastOut .3s ease forwards; }
.toast .t-emo { font-size: 42px; flex: none; }
.toast b { display: block; font-size: 16px; font-weight: 800; line-height: 1.35; }
.toast p { margin-top: 2px; font-size: 14px; line-height: 1.45; color: var(--ink-soft); }
.toast .t-tag { display: inline-block; margin-inline-end: 6px; padding: 1px 8px; border-radius: 7px; background: var(--tb); color: var(--ink); font-size: 11px; font-weight: 800; vertical-align: 2px; }
.toast.new { --tb: var(--accent); }
.toast.new .t-tag { color: #fff; }
.toast.mishap { --tb: var(--mishap); background: #f6fdf0; }
.toast.legend { --tb: var(--legend); background: linear-gradient(#fffbea, #fff); }
.toast.info { --tb: var(--t1); }
.toast.meh { --tb: var(--line); }

/* ---------- Start screen ---------- */
.start {
  position: fixed;
  inset: 0;
  z-index: 1200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: radial-gradient(circle at 50% 35%, #fffdf8, #ffe9d6 70%);
}
.start[hidden] { display: none; }
.start.leaving { animation: fadeOut .35s ease forwards; }
.start-card { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.start-logo { font-size: 110px; animation: floaty 2.6s ease-in-out infinite; }
.start h1 { font-size: 38px; font-weight: 800; }
.start p { font-size: 18px; font-weight: 700; color: var(--accent-d); }
.play-btn {
  margin-top: 14px;
  min-height: 76px;
  padding: 0 40px;
  border: none;
  border-radius: 999px;
  background: linear-gradient(#ff8db0, var(--accent));
  box-shadow: 0 6px 0 var(--accent-d), 0 14px 30px rgba(226, 81, 127, .35);

  font-size: 28px;
  font-weight: 800;
  animation: pulse 1.6s ease-in-out infinite;
}
.play-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-d); }

/* ---------- Modals (album, gate, parents) ---------- */
.modal { position: fixed; inset: 0; z-index: 800; display: flex; align-items: flex-end; justify-content: center; }
.modal[hidden] { display: none; }
.backdrop { position: absolute; inset: 0; background: rgba(74, 44, 29, .45); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fadeIn .25s ease both; }
.drawer {
  position: relative;
  width: 100%;
  max-width: 720px;
  height: min(88vh, 800px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--panel);
  border-radius: 28px 28px 0 0;
  box-shadow: 0 -10px 40px rgba(74, 44, 29, .25);
  animation: slideUp .38s cubic-bezier(.2, .9, .3, 1.08) both;
}
@supports (height: 1dvh) { .drawer { height: min(88dvh, 800px); } }
.modal.closing .backdrop { animation: fadeOut .25s ease forwards; }
.modal.closing .drawer { animation: slideDown .25s ease-in forwards; }
.modal.sheet .drawer { height: auto; max-height: 90vh; }
@media (orientation: landscape) and (min-width: 560px) {
  .modal { justify-content: flex-end; align-items: stretch; }
  .drawer { height: 100%; max-width: 560px; border-radius: 0 28px 28px 0; animation-name: slideFromLeft; }
  .modal.closing .drawer { animation-name: slideToLeft; }
  .grab { display: none; }
  .modal.sheet { justify-content: center; align-items: center; }
  .modal.sheet .drawer { height: auto; max-height: 92%; max-width: 520px; border-radius: 28px; animation-name: fadeUp; }
  .modal.sheet.closing .drawer { animation-name: fadeOut; }
}
.grab { width: 44px; height: 5px; margin: 8px auto 0; border-radius: 3px; background: var(--line); flex: none; }
.book-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px 8px; flex: none; }
.book-head h2 { font-size: 23px; font-weight: 800; }
.book-count { font-size: 14px; font-weight: 600; color: var(--ink-soft); margin-top: 2px; }
.progress { position: relative; height: 14px; margin: 4px 18px 14px; margin-inline-end: 46px; border-radius: 999px; background: #f6e6d6; flex: none; }
.progress i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(270deg, var(--caramel), var(--accent)); transition: width .6s cubic-bezier(.3, 1.3, .5, 1); }
.progress .goal { position: absolute; inset-inline-end: -36px; top: 50%; translate: 0 -50%; font-size: 28px; }
.book-tabs { padding: 0 18px 10px; flex: none; }
.book-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  grid-auto-rows: 118px;
  gap: 16px 14px;
  padding: 10px 20px 22px;
  overflow-y: auto;
  overscroll-behavior: contain;
  align-content: start;
}
/* Stickers */
.card {
  position: relative;
  border: none;
  border-radius: 24px;
  background: #fff;
  box-shadow: 0 0 0 5px #fff, 0 0 0 8px var(--tc, var(--t1)), 0 8px 14px rgba(74, 44, 29, .2);
  display: flex;
  flex-direction: column;

  padding: 6px;

  transition: transform .15s ease;
}
.card::before {
  content: "";
  position: absolute;

}
.card:active { transform: rotate(0deg) scale(1.06); }
.card .emo { font-size: 50px; }
.card .lbl { font-size: 13px; font-weight: 800; text-align: center; line-height: 1.2; }
.card.t2 { --tc: var(--t2); } .card.t3 { --tc: var(--t3); } .card.mishap { --tc: var(--mishap); } .card.legendary { --tc: var(--legend); background: linear-gradient(#fffbe6, #fff0b0); }
.card.locked { background: rgba(255, 255, 255, .35); box-shadow: inset 0 0 0 3px #eadccd; transform: none; }
.card.locked::before { display: none; }
.card.locked .emo { filter: brightness(0) saturate(0); opacity: .13; }
.card.locked .lbl { color: #c4ab9a; font-size: 22px; }
.card.ready::after { content: "✨"; position: absolute; top: 4px; inset-inline-end: 6px; font-size: 16px; font-family: var(--emoji); animation: twinkle 1.4s ease-in-out infinite; }
.card.shake { animation: shakeX .35s ease; }
.card .new { position: absolute; top: -4px; inset-inline-end: -4px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #fff; }

.detail {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 18px 22px calc(22px + env(safe-area-inset-bottom));
  overflow-y: auto;
  text-align: center;
  background: var(--panel);
  animation: fadeUp .28s ease both;
}
.detail[hidden] { display: none; }
.detail-top { align-self: stretch; display: flex; justify-content: space-between; gap: 8px; }
.soft-btn { min-height: 46px; padding: 0 16px; border: none; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 rgba(74, 44, 29, .1); font-weight: 700; font-size: 15px; }
.d-emo { font-size: 104px; margin-top: 6px; animation: floaty 3s ease-in-out infinite; }
.d-emo.locked { filter: brightness(0) saturate(0); opacity: .18; animation: none; }
.detail h3 { font-size: 27px; font-weight: 800; }
.tag { padding: 3px 12px; border-radius: 999px; background: var(--tc, var(--t1)); font-size: 13px; font-weight: 800; }
.tag.t2 { --tc: var(--t2); } .tag.t3 { --tc: var(--t3); } .tag.mishap { --tc: var(--mishap); } .tag.legendary { --tc: var(--legend); } .tag.locked { --tc: #eadccd; }
.detail > p { max-width: 36ch; font-size: 17px; line-height: 1.6; color: var(--ink-soft); font-weight: 600; }
.d-section { width: 100%; max-width: 420px; margin-top: 8px; }
.d-section h4 { font-size: 14px; font-weight: 800; color: var(--ink-soft); margin-bottom: 6px; }
.eq { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 10px; margin-bottom: 6px; border-radius: 16px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; font-size: 15px; }
.eq .emo { font-size: 26px; vertical-align: -5px; margin-inline-end: 4px; }
.eq .plus { color: var(--ink-soft); font-size: 20px; }
.uses { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.uses > span { padding: 5px 11px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-size: 14px; font-weight: 700; }
.uses .emo { margin-inline-end: 4px; }

/* Parent gate */
.gate-q { padding: 4px 18px 12px; font-size: 30px; font-weight: 800; text-align: center; }
.gate-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 18px 24px; }
.gate-opts button { min-height: 68px; border: none; border-radius: 20px; background: #fff; box-shadow: inset 0 0 0 3px var(--line), 0 3px 0 rgba(74, 44, 29, .1); font-size: 30px; font-weight: 800; }
.gate-opts.wrong { animation: shakeX .4s ease; }

/* Parents zone */
.parents-body { overflow-y: auto; padding: 0 18px 24px; display: grid; gap: 18px; }
.parents-body h3 { font-size: 16px; font-weight: 800; margin-bottom: 8px; color: var(--ink-soft); }
.parents-body p { font-size: 14px; line-height: 1.6; color: var(--ink-soft); font-weight: 600; }
.mode-list { display: grid; gap: 10px; }
.mode-card { display: flex; align-items: center; gap: 14px; min-height: 80px; padding: 12px 14px; border: none; border-radius: 20px; background: #fff; box-shadow: inset 0 0 0 3px var(--line), 0 3px 0 rgba(74, 44, 29, .1); text-align: start; }
.mode-card > .emo { font-size: 42px; flex: none; }
.mode-card .mc-text { min-width: 0; flex: 1; }
.mode-card b { display: block; font-size: 17px; font-weight: 800; }
.mode-card small { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--ink-soft); line-height: 1.4; }
.mode-card .mc-prog { flex: none; font-size: 15px; font-weight: 800; white-space: nowrap; }
.mode-card .mc-now { display: inline-block; margin-inline-start: 6px; padding: 1px 8px; border-radius: 7px; background: var(--accent); color: #fff; font-size: 11px; vertical-align: 2px; }
.mode-card.active { box-shadow: inset 0 0 0 3px var(--accent), 0 3px 0 rgba(74, 44, 29, .1); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 6px 14px; margin-bottom: 8px; border-radius: 16px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; font-size: 16px; }
.switch { position: relative; flex: none; width: 58px; height: 34px; border: none; border-radius: 999px; background: #e3d3c5; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--mint); }
.switch[aria-checked="true"]::after { transform: translateX(-24px); }
.voice-status { margin: 4px 2px 10px; }
.voice-status.bad { color: var(--accent-d) !important; }
.danger { min-height: 46px; padding: 0 16px; border: none; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 2px #f3b6c6; color: var(--accent-d); font-size: 15px; font-weight: 700; margin-top: 8px; }
.danger.armed { background: var(--accent-d); color: #fff; box-shadow: none; animation: shakeX .35s ease; }
.soft-btn[hidden] { display: none; }

noscript { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); font-size: 20px; text-align: center; }

/* ---------- Keyframes ---------- */
@keyframes logoSpin { 0%, 80%, 100% { transform: rotate(0); } 88% { transform: rotate(-18deg); } 94% { transform: rotate(12deg); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

@keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

@keyframes popUp { 0% { transform: translateY(55%) scale(.15); opacity: 0; } 60% { transform: translateY(-14%) scale(1.14); opacity: 1; } 100% { transform: translateY(-6%) scale(1); opacity: 1; } }
@keyframes popOut { to { transform: translateY(-20%) scale(.6); opacity: 0; } }
@keyframes captionIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes shakeX { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@keyframes arrive { 0% { transform: scale(.3); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }

<body>
<noscript>🍳 تحتاج لعبة مختبر المطبخ إلى تفعيل جافاسكربت.</noscript>

<div class="start" id="startScreen">
  <div class="start-card">
    <div class="start-logo emo" id="startLogo" aria-hidden="true">🍳</div>

</div>

        <small id="brandMode">مطبخ كل يوم</small>
      </span>

      <div class="bowl-area" id="bowlArea">

          <svg class="bowl-svg" id="bowlSvg" viewBox="0 0 260 215" aria-hidden="true">
            <defs>
              <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffd3e0"/>
                <stop offset=".55" stop-color="#ffa2bf"/>
                <stop offset="1" stop-color="#f27aa1"/>

// Active mode data — rebuilt by setModeData()
let MODE, ITEMS, STARTERS, RECIPES, IDS, IDX, TOTAL, FILTERS, RECIPE_MAP, bookOrder;
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';

const recipeKey = (a, b) => (a < b ? a + '+' + b : b + '+' + a);
const lookup = (a, b) => RECIPE_MAP.get(recipeKey(a, b)) || null;

function validateData() {
  const map = new Map();
  const problems = [];
  for (const [a, b, r] of RECIPES) {
    for (const id of [a, b, r]) if (!ITEMS[id]) problems.push(`unknown item "${id}"`);
    const k = recipeKey(a, b);
    if (map.has(k) && map.get(k) !== r) problems.push(`conflicting recipe ${k}`);
    map.set(k, r);
  }
  for (const id of IDS) {
    if (!STARTERS.includes(id) && !RECIPES.some(x => x[2] === id)) problems.push(`"${id}" has no recipe`);
  }
  for (const id of [...MODE.startWith, ...MODE.unlockOrder]) {
    if (!ITEMS[id] || ITEMS[id].kind !== 'base') problems.push(`starter "${id}" is not a base item`);
  }
  if (problems.length) console.warn(`[KitchenLab] ${MODE.key} recipe data issues:`, problems);
  return map;
}

function setModeData(key) {
  MODE = MODES[key] || MODES.kitchen;
  ITEMS = MODE.items;
  RECIPES = MODE.recipes;
  IDS = Object.keys(ITEMS);
  STARTERS = IDS.filter(id => ITEMS[id].kind === 'base');
  IDX = Object.fromEntries(IDS.map((id, i) => [id, i]));
  TOTAL = IDS.length;
  FILTERS = [
    { k: 'all', l: 'الكل' },
    { k: 't1', l: MODE.filterLabels.t1 },
    { k: 't2', l: MODE.filterLabels.t2 },
    { k: 't3', l: MODE.filterLabels.t3 },
    { k: 'mishap', l: 'أوه لا!' },
  ];
  RECIPE_MAP = validateData();
  if (!MODE.fallbacksApplied) {
    MODE.fallbacksApplied = true;
    applyEmojiFallbacks();
  }
  bookOrder = IDS.slice().sort((a, b) => ITEMS[a].tier - ITEMS[b].tier || IDX[a] - IDX[b]);
}

function anim(node, frames, opts) {
  return new Promise(resolve => {
    const total = (opts.duration || 300) * (opts.iterations || 1) + (opts.delay || 0);
    try {
      if (node.animate) {
        const a = node.animate(frames, opts);
        a.onfinish = resolve;
        a.oncancel = resolve;
        setTimeout(resolve, total + 150); // safety net
        return;
      }
    } catch (e) { /* fall through */ }
    setTimeout(resolve, 0);
  });
}

function mixColors(hexes) {
  if (!hexes.length) return null;
  let r = 0, g = 0, b = 0;
  for (const h of hexes) {
    const n = parseInt(h.slice(1), 16);
    r += (n >> 16) & 255; g += (n >> 8) & 255; b += n & 255;
  }
  const k = hexes.length;
  return `rgb(${Math.round(r / k)},${Math.round(g / k)},${Math.round(b / k)})`;
}

// Swap emoji that this device cannot render for a safe alternative.
function applyEmojiFallbacks() {
  let ctx;
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 24;
    ctx = c.getContext('2d', { willReadFrequently: true });
    if (!ctx) return;
  } catch (e) { return; }
  const render = ch => {
    ctx.clearRect(0, 0, 24, 24);
    ctx.textBaseline = 'top';
    ctx.font = '20px ' + EMOJI_FONT;
    ctx.fillText(ch, 0, 0);
    return ctx.getImageData(0, 0, 24, 24).data;
  };
  try {
    const tofu = render('\u{10FFFD}');
    for (const id of IDS) {
      const it = ITEMS[id];
      if (!it.alt) continue;
      const d = render(it.emoji);
      let diff = 0;
      for (let i = 3; i < d.length; i += 4) if (d[i] !== tofu[i]) diff++;
      if (diff <= 10) it.emoji = it.alt;
    }
  } catch (e) { /* canvas read blocked — keep originals */ }
}

   ===================================================================== */
const Store = {
  ok: true,
  warned: false,
  read(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const d = JSON.parse(raw);
      return d && typeof d === 'object' ? d : null;
    } catch (e) {
      console.warn('[KitchenLab] could not read save', e);
      this.ok = false;
      return null;
    }
  },
  write(key, data) {
    try {
      localStorage.setItem(key, JSON.stringify(data));
      this.ok = true;
    } catch (e) {
      this.ok = false;
      if (!this.warned) {
        this.warned = true;
        toast({ emoji: '💾', title: 'لا يمكن حفظ التقدّم', text: 'هذا المتصفّح يمنع الحفظ، لكن يمكنك اللعب!', kind: 'meh', duration: 5000 });
      }
    }
  },
  clear(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } },
};

  orderTarget: null,
  customer: null,
};

function resetState() {
  state.discovered = new Set();
  state.order = [];
  state.unseen = new Set();
  state.stats = { mixes: 0, mishaps: 0 };
  state.stars = 0;
  state.served = 0;
  state.completed = false;
  state.hint = { key: null, level: 0, at: 0 };
  MODE.startWith.forEach(id => { state.discovered.add(id); state.order.push(id); });
  state.albumSeen = state.discovered.size;
}

function loadState() {
  resetState();
  const d = Store.read(MODE.storeKey);
  if (!d) return false;
  if (Array.isArray(d.discovered)) {
    for (const id of d.discovered) {
      if (ITEMS[id] && !state.discovered.has(id)) { state.discovered.add(id); state.order.push(id); }
    }
  }
  if (Array.isArray(d.unseen)) d.unseen.forEach(id => { if (state.discovered.has(id)) state.unseen.add(id); });
  if (d.stats && typeof d.stats === 'object') {
    for (const k of ['mixes', 'mishaps']) {
      const v = Number(d.stats[k]);
      if (Number.isFinite(v) && v >= 0) state.stats[k] = Math.floor(v);
    }
  }
  const count = v => (Number.isFinite(Number(v)) && Number(v) >= 0 ? Math.floor(Number(v)) : 0);
  state.stars = count(d.stars);
  state.served = count(d.served);
  state.albumSeen = d.albumSeen == null ? state.discovered.size : Math.min(count(d.albumSeen), state.discovered.size);
  state.completed = d.completed === true && state.discovered.size === TOTAL;
  return true;
}

function save() {
  Store.write(MODE.storeKey, {
    v: 2,
    discovered: state.order,
    unseen: [...state.unseen],
    stats: state.stats,
    stars: state.stars,
    served: state.served,
    albumSeen: state.albumSeen,
    completed: state.completed,
    savedAt: Date.now(),
  });
}

// Global preferences (mode + audio), shared by both kitchens.
function loadPrefs() {
  const p = Store.read(PREFS_KEY);
  // First run after an upgrade: inherit audio settings from the old bakery save.
  const legacy = p ? null : Store.read(MODES.bakery.storeKey);
  const s = p || (legacy && legacy.settings) || {};
  for (const k of ['sfx', 'music', 'voice']) if (typeof s[k] === 'boolean') state.settings[k] = s[k];
  state.mode = p && MODES[p.mode] ? p.mode : 'kitchen';
}

function savePrefs() {
  Store.write(PREFS_KEY, { v: 2, mode: state.mode, ...state.settings });
}

/* =====================================================================
   Sound — Web Audio synthesizer (no audio files)
   ===================================================================== */
const Sound = (() => {
  let ctx = null, master, sfxBus, musicBus, voiceBus, echoIn, noiseBuf;
  let sfxOn = true, musicOn = false, timer = null, nextT = 0, step = 0;

  function ensure() {
    if (ctx) {
      if (ctx.state === 'suspended' && !document.hidden) ctx.resume().catch(() => {});
      return ctx;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.ratio.value = 4;
      master = ctx.createGain();
      master.gain.value = .85;
      master.connect(comp);
      comp.connect(ctx.destination);
      sfxBus = ctx.createGain();
      sfxBus.gain.value = .75;
      sfxBus.connect(master);
      musicBus = ctx.createGain();
      musicBus.gain.value = 0;
      musicBus.connect(master);
      // sparkly echo send for the discovery jingle
      echoIn = ctx.createGain();
      const delay = ctx.createDelay(1);
      delay.delayTime.value = .17;
      const fb = ctx.createGain();
      fb.gain.value = .32;
      const wet = ctx.createGain();
      wet.gain.value = .4;
      echoIn.connect(sfxBus);
      echoIn.connect(delay);
      delay.connect(fb); fb.connect(delay);
      delay.connect(wet); wet.connect(sfxBus);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    } catch (e) {
      console.warn('[CookieLab] Web Audio unavailable', e);
      ctx = null;
    }
    return ctx;
  }

  function tone(o) {
    const T = o.at != null ? o.at : ctx.currentTime + (o.t || 0);
    const dur = o.dur || .2;
    const vol = o.vol == null ? .3 : o.vol;
    const atk = Math.min(o.attack || .005, dur * .5);
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, T);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), T + (o.glide || dur));
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, T);
    g.gain.linearRampToValueAtTime(vol, T + atk);
    g.gain.exponentialRampToValueAtTime(.0001, T + dur);
    let out = osc;
    if (o.filter) {
      const fl = ctx.createBiquadFilter();
      fl.type = o.filter.type || 'lowpass';
      fl.frequency.setValueAtTime(o.filter.f, T);
      if (o.filter.f2) fl.frequency.exponentialRampToValueAtTime(o.filter.f2, T + dur);
      fl.Q.value = o.filter.q || 1;
      osc.connect(fl);
      out = fl;
    }
    if (o.vib) {
      const lfo = ctx.createOscillator();
      const lg = ctx.createGain();
      lfo.frequency.value = o.vibRate || 6;
      lg.gain.value = o.vib;
      lfo.connect(lg);
      lg.connect(osc.frequency);
      lfo.start(T);
      lfo.stop(T + dur + .1);
    }
    out.connect(g);
    g.connect(o.dest || sfxBus);
    osc.start(T);
    osc.stop(T + dur + .1);
  }

  function noise(o) {
    const T = ctx.currentTime + (o.t || 0);
    const dur = o.dur || .2;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const fl = ctx.createBiquadFilter();
    fl.type = o.type || 'lowpass';
    fl.frequency.setValueAtTime(o.f || 1000, T);
    if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, T + dur);
    fl.Q.value = o.q || .7;
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, T);
    g.gain.linearRampToValueAtTime(o.vol || .2, T + Math.min(o.attack || .005, dur * .5));
    g.gain.exponentialRampToValueAtTime(.0001, T + dur);
    src.connect(fl);
    fl.connect(g);
    g.connect(o.dest || sfxBus);
    src.start(T, Math.random() * .9);
    src.stop(T + dur + .05);
  }

  function bell(f, t, vol, dest) {
    [[1, 1, 1.6], [2.76, .32, .8], [5.4, .14, .4], [8.93, .05, .2]].forEach(([m, v, d]) =>
      tone({ type: 'sine', f: f * m, t, dur: d, vol: vol * v, attack: .002, dest }));
  }

  const play = fn => {
    if (!sfxOn || !ensure()) return;
    try { fn(); } catch (e) { console.warn('[CookieLab] sound error', e); }
  };

  // --- background chimes ---
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  const STEP = 60 / 88 / 2; // eighth notes at 88 bpm
  const CHORDS = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]]; // C Am F G
  const RHYTHM = [1, 0, 1, 1, 0, 1, 0, 1];
  const MELODY = [0, 2, 1, 2, 0, 1, 2, 0];
  const hash = s => { const x = Math.sin(s * 12.9898) * 43758.5453; return x - Math.floor(x); };

  function scheduleStep(t, s) {
    const bar = Math.floor(s / 8) % 4;
    const i = s % 8;
    const chord = CHORDS[bar];
    if (i === 0) {
      tone({ at: t, type: 'sine', f: midi(chord[0] - 12), dur: STEP * 8, vol: .09, attack: .25, dest: musicBus });
      tone({ at: t, type: 'triangle', f: midi(chord[0] - 24), dur: STEP * 4, vol: .06, attack: .05, dest: musicBus });
    }
    if (RHYTHM[i] && hash(s) > .18) {
      const lift = (Math.floor(s / 32) % 2 && i >= 4) ? 12 : 0;
      const n = chord[MELODY[i]] + 12 + lift;
      tone({ at: t, type: 'sine', f: midi(n), dur: 1.2, vol: .1, attack: .01, dest: musicBus });
      tone({ at: t, type: 'sine', f: midi(n) * 3, dur: .35, vol: .012, attack: .005, dest: musicBus });
    }
  }

  function scheduler() {
    if (!ctx) return;
    if (nextT < ctx.currentTime - .1) nextT = ctx.currentTime + .05;
    while (nextT < ctx.currentTime + .25) {
      scheduleStep(nextT, step++);
      nextT += STEP;
    }
  }

  function setMusic(on) {
    musicOn = on;
    if (on) {
      if (!ensure()) return;
      if (!timer) {
        nextT = ctx.currentTime + .1;
        step = 0;
        timer = setInterval(scheduler, 60);
      }
      musicBus.gain.cancelScheduledValues(ctx.currentTime);
      musicBus.gain.setTargetAtTime(.55, ctx.currentTime, .6);
    } else if (ctx) {
      musicBus.gain.cancelScheduledValues(ctx.currentTime);
      musicBus.gain.setTargetAtTime(0, ctx.currentTime, .2);
      setTimeout(() => { if (!musicOn && timer) { clearInterval(timer); timer = null; } }, 900);
    }
  }

  return {
    ensure,
    setSfx(on) { sfxOn = on; },
    // Output for recorded voice clips (independent of the sound-effects switch).
    voiceDest() {
      if (!ensure()) return null;
      if (!voiceBus) {
        voiceBus = ctx.createGain();
        voiceBus.gain.value = 1;
        voiceBus.connect(master);
      }
      return voiceBus;
    },
    // Lower the music while someone is talking.
    duck(on) {
      if (!ctx || !musicOn) return;
      musicBus.gain.cancelScheduledValues(ctx.currentTime);
      musicBus.gain.setTargetAtTime(on ? .18 : .55, ctx.currentTime, .15);
    },
    setMusic,
    suspend() { if (ctx && ctx.state === 'running') ctx.suspend().catch(() => {}); },
    resume() { if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {}); },
    pop: () => play(() => {
      tone({ type: 'sine', f: 380, f2: 1000, dur: .1, vol: .32 });
      tone({ type: 'triangle', f: 1600, f2: 2300, dur: .05, vol: .05, t: .02 });
    }),
    tap: () => play(() => tone({ type: 'sine', f: 900, f2: 700, dur: .05, vol: .12 })),
    drop: () => play(() => {
      tone({ type: 'sine', f: 640, f2: 150, dur: .17, vol: .42 });
      noise({ dur: .06, vol: .16, type: 'lowpass', f: 900 });
    }),
    boing: () => play(() => tone({ type: 'triangle', f: 210, f2: 520, dur: .18, vol: .2, vib: 30, vibRate: 22 })),
    stir: () => play(() => {
      noise({ dur: 1, vol: .12, type: 'bandpass', f: 300, f2: 2400, q: 2.5, attack: .2 });
      for (let i = 0; i < 7; i++) {
        const f = rnd(280, 640);
        tone({ type: 'sine', f, f2: f * 1.6, t: .1 + i * .12, dur: .07, vol: .1 });
      }
    }),
    ovenDing: () => play(() => bell(1318.5, 0, .26)),
    magic: () => play(() => {
      [1046.5, 1318.5, 1568, 2093, 2637].forEach((f, i) => {
        tone({ type: 'triangle', f, t: i * .075, dur: .42, vol: .18, dest: echoIn });
        tone({ type: 'sine', f: f * 2, t: i * .075, dur: .25, vol: .04, dest: echoIn });
      });
      noise({ t: .05, dur: .7, vol: .04, type: 'highpass', f: 7000 });
    }),
    splat: () => play(() => {
      tone({ type: 'sawtooth', f: 620, f2: 70, dur: .6, vol: .15, vib: 50, vibRate: 11, filter: { type: 'lowpass', f: 1800, f2: 400 } });
      noise({ t: .42, dur: .3, vol: .38, type: 'lowpass', f: 1400, f2: 140 });
      tone({ type: 'sine', f: 190, f2: 45, t: .42, dur: .24, vol: .45 });
    }),
    nope: () => play(() => {
      tone({ type: 'triangle', f: 392, f2: 370, dur: .26, vol: .2 });
      tone({ type: 'triangle', f: 311, f2: 247, t: .28, dur: .55, vol: .2, vib: 7, vibRate: 6 });
    }),
    giggle: () => play(() => {
      [0, .1, .2, .3].forEach((t, i) => tone({ type: 'sine', f: 820 + i * 60, f2: 1150 + i * 40, t, dur: .08, vol: .22, vib: 25, vibRate: 30 }));
    }),
    sneeze: () => play(() => {
      tone({ type: 'triangle', f: 260, f2: 620, dur: .38, vol: .16, attack: .2 });
      noise({ t: .42, dur: .28, vol: .42, type: 'highpass', f: 1800 });
      tone({ type: 'square', f: 420, f2: 160, t: .42, dur: .18, vol: .08 });
    }),
    gift: () => play(() => {
      [784, 988, 1175, 1568].forEach((f, i) => tone({ type: 'triangle', f, t: i * .06, dur: .3, vol: .16, dest: echoIn }));
      bell(2093, .3, .12, echoIn);
    }),
    coin: () => play(() => {
      tone({ type: 'square', f: 988, dur: .09, vol: .12 });
      tone({ type: 'square', f: 1319, t: .08, dur: .35, vol: .12 });
      bell(2637, .1, .06);
    }),
    fanfare: () => play(() => {
      [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5].forEach((f, i) =>
        tone({ type: 'triangle', f, t: i * .11, dur: i === 6 ? 1.2 : .3, vol: .2, dest: echoIn }));
      [523.25, 659.25, 783.99].forEach(f => tone({ type: 'sine', f, t: .77, dur: 1.4, vol: .1 }));
    }),
  };
})();

/* =====================================================================
   FX — canvas particles
   ===================================================================== */
const FX = (() => {
  const cv = $('#fx');
  const cx = cv.getContext('2d');
  let W = 0, H = 0, parts = [], raf = 0, last = 0;
  const COLORS = ['#ffcf3f', '#ff6f9c', '#7cc4ff', '#5cc9a0', '#b8a4ff', '#ffffff', '#ffb44c'];
  const amount = n => Math.round(n * (reducedMotion.matches ? .3 : 1));
  const pick = arr => arr[(Math.random() * arr.length) | 0];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawn(p) {
    p.max = p.life;
    parts.push(Object.assign({ vx: 0, vy: 0, g: 0, drag: .98, size: 6, rot: 0, vr: 0, grow: 0, color: '#fff', type: 'dot' }, p));
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
  }

  function ring(n, fn) {
    n = amount(n);
    for (let i = 0; i < n; i++) fn(rnd(0, Math.PI * 2), i);
  }

  function star(x, y, r, rot) {
    cx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * .45 : r;
      const a = rot + i * Math.PI / 5;
      cx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    cx.closePath();
    cx.fill();
  }

  function draw(p) {
    const k = p.life / p.max;
    cx.globalAlpha = p.type === 'confetti' ? Math.min(1, k * 3) : p.type === 'smoke' ? .4 * k : Math.min(1, k * 1.6);
    cx.fillStyle = p.color;
    switch (p.type) {
      case 'star':
        star(p.x, p.y, p.size * (.7 + .3 * Math.sin(p.rot * 3)), p.rot);
        break;
      case 'goop': {
        const sp = Math.hypot(p.vx, p.vy);
        cx.save();
        cx.translate(p.x, p.y);
        cx.rotate(Math.atan2(p.vy, p.vx));
        cx.beginPath();
        cx.ellipse(0, 0, p.size * (1 + Math.min(1.2, sp / 700)), p.size, 0, 0, Math.PI * 2);
        cx.fill();
        cx.restore();
        break;
      }
      case 'confetti':
        cx.save();
        cx.translate(p.x, p.y);
        cx.rotate(p.rot);
        cx.scale(Math.cos(p.rot * 2), 1);
        cx.fillRect(-p.size / 2, -p.size * .8, p.size, p.size * 1.6);
        cx.restore();
        break;
      case 'emoji':
        cx.save();
        cx.translate(p.x, p.y);
        cx.rotate(p.rot);
        cx.font = `${p.size}px ${EMOJI_FONT}`;
        cx.textAlign = 'center';
        cx.textBaseline = 'middle';
        cx.fillText(p.ch, 0, 0);
        cx.restore();
        break;
      default: // dot & smoke
        cx.beginPath();
        cx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        cx.fill();
        if (p.type === 'dot') {
          cx.globalAlpha *= .3;
          cx.beginPath();
          cx.arc(p.x, p.y, p.size * 2.2, 0, Math.PI * 2);
          cx.fill();
        }
    }
  }

  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    cx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0 || p.y > H + 60) { parts.splice(i, 1); continue; }
      const f = Math.pow(p.drag, dt * 60);
      p.vx *= f;
      p.vy = p.vy * f + p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.size += p.grow * dt;
      draw(p);
    }
    cx.globalAlpha = 1;
    raf = parts.length ? requestAnimationFrame(tick) : 0;
    if (!raf) cx.clearRect(0, 0, W, H);
  }

  return {
    resize,
    sparkle(x, y, emoji) {
      ring(36, a => {
        const s = rnd(160, 540);
        spawn({ type: Math.random() < .6 ? 'star' : 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 140, g: 440, drag: .95, life: rnd(.7, 1.3), size: rnd(4, 11), color: pick(COLORS), rot: rnd(0, 6), vr: rnd(-8, 8) });
      });
      if (emoji) ring(7, a => {
        const s = rnd(200, 380);
        spawn({ type: 'emoji', ch: emoji, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 220, g: 620, drag: .97, life: rnd(.9, 1.4), size: rnd(18, 28), rot: rnd(-1, 1), vr: rnd(-4, 4) });
      });
    },
    splat(x, y, color) {
      ring(30, a => {
        const s = rnd(140, 460);
        spawn({ type: 'goop', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 280, g: 950, drag: .97, life: rnd(.8, 1.4), size: rnd(5, 12), color: Math.random() < .55 ? color : pick(['#9fd67f', '#7fb85e', '#c7e6a8']) });
      });
      ring(8, () => spawn({ type: 'smoke', x: x + rnd(-30, 30), y, vx: rnd(-40, 40), vy: rnd(-90, -30), g: -20, drag: .97, life: rnd(.9, 1.4), size: rnd(10, 18), grow: 34, color: '#a8998c' }));
    },
    puff(x, y) {
      ring(12, a => spawn({ type: 'smoke', x: x + Math.cos(a) * 30, y: y + Math.sin(a) * 10, vx: Math.cos(a) * rnd(20, 70), vy: rnd(-80, -20), g: -20, drag: .97, life: rnd(.8, 1.3), size: rnd(10, 18), grow: 38, color: '#bba99a' }));
    },
    mini(x, y) {
      ring(14, a => {
        const s = rnd(90, 260);
        spawn({ type: Math.random() < .5 ? 'star' : 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, g: 300, drag: .94, life: rnd(.4, .8), size: rnd(3, 7), color: pick(COLORS), rot: rnd(0, 6), vr: rnd(-6, 6) });
      });
    },
    confetti() {
      const n = amount(170);
      for (let i = 0; i < n; i++) {
        spawn({ type: 'confetti', x: rnd(0, W), y: rnd(-H * .4, -10), vx: rnd(-70, 70), vy: rnd(60, 240), g: 260, drag: .99, life: rnd(2.6, 4.2), size: rnd(6, 11), color: pick(COLORS.slice(0, 5)), rot: rnd(0, 6), vr: rnd(-9, 9) });
      }
    },
  };
})();
