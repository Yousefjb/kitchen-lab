/* =====================================================================
   Toasts & caption
   ===================================================================== */
function toast({ emoji = '🍪', title, text = '', kind = 'info', tag = '', duration = 3400 }) {
  const t = el('div', 'toast ' + kind);
  t.setAttribute('role', 'status');
  const body = el('div', 't-body');
  const h = el('b');
  if (tag) h.appendChild(el('span', 't-tag', tag));
  h.appendChild(document.createTextNode(title));
  body.appendChild(h);
  if (text) body.appendChild(el('p', null, text));
  t.append(el('span', 't-emo emo', emoji), body);
  toastsEl.appendChild(t);
  while (toastsEl.children.length > 3) toastsEl.firstElementChild.remove();
  const kill = () => {
    if (t._dead) return;
    t._dead = true;
    t.classList.add('out');
    setTimeout(() => t.remove(), 320);
  };
  setTimeout(kill, duration);
  t.addEventListener('click', kill);
}

let captionTimer = 0;
function setCaption(text, warn = false, revertMs = 0) {
  clearTimeout(captionTimer);
  caption.textContent = text;
  caption.classList.toggle('warn', warn);
  caption.classList.remove('flash');
  void caption.offsetWidth;
  caption.classList.add('flash');
  if (revertMs) captionTimer = setTimeout(bowlCaption, revertMs);
}

function bowlCaption() {
  const [a, b] = state.bowl;
  const one = a && !b ? a : !a && b ? b : null;
  if (one) {
    const it = ITEMS[one];
    const n = partnersOf(one).size;
    setCaption(n
      ? `${it.emoji} ${it.name} + … ? ✨ ${n} glowing partner${n > 1 ? 's make' : ' makes'} something new!`
      : `${it.emoji} ${it.name} + … ? Nothing new pairs with ${it.name} — try another ingredient.`);
  } else if (!a && !b) setCaption(state.stats.mixes === 0 ? 'Drag two ingredients into the bowl — or just tap them!' : 'Drag two ingredients into the bowl!');
}

/* =====================================================================
   Pantry rendering
   ===================================================================== */
const matchesFilter = (id, k) => {
  const it = ITEMS[id];
  if (k === 'all') return true;
  if (k === 'mishap') return it.kind === 'mishap';
  return it.kind !== 'mishap' && 't' + it.tier === k;
};

function renderChips() {
  pantryChips.replaceChildren(...FILTERS.map(f => {
    const n = state.order.filter(id => matchesFilter(id, f.k)).length;
    const b = el('button', 'chip', f.l);
    b.appendChild(el('span', 'n', String(n)));
    b.setAttribute('aria-pressed', String(state.filter === f.k));
    b.addEventListener('click', () => {
      if (state.filter === f.k) return;
      Sound.tap();
      state.filter = f.k;
      renderChips();
      renderPantry();
    });
    return b;
  }));
}

let pendingRender = null;
function renderPantry(opts = {}) {
  if (drag) { pendingRender = true; return; }
  const pos = Object.fromEntries(state.order.map((id, i) => [id, i]));
  const ids = state.order
    .filter(id => matchesFilter(id, state.filter))
    .sort((a, b) => ITEMS[a].tier - ITEMS[b].tier || pos[a] - pos[b]);
  const frag = document.createDocumentFragment();
  for (const id of ids) {
    const it = ITEMS[id];
    const t = el('button', 'tile ' + itemClasses(id).join(' '));
    t.dataset.id = id;
    t.setAttribute('aria-label', `${it.name}${it.kind === 'mishap' ? ' (mishap)' : ''}. Drag into the bowl, or press to add.`);
    t.append(el('span', 'emo', it.emoji), el('span', 'lbl', it.name));
    if (state.unseen.has(id)) t.appendChild(el('span', 'new', 'NEW'));
    if (opts.incoming === id) t.classList.add('incoming');
    frag.appendChild(t);
  }
  if (!ids.length) frag.appendChild(el('p', 'empty', 'Nothing here yet — keep experimenting!'));
  pantryGrid.replaceChildren(frag);
  refreshGlow();
}

function flushRender() {
  if (pendingRender && !drag) {
    pendingRender = null;
    renderPantry();
  }
}

const findTile = id => pantryGrid.querySelector(`.tile[data-id="${id}"]`);

// Discovered items that would make something NEW together with `id`.
function partnersOf(id) {
  const out = new Set();
  for (const p of state.discovered) {
    const r = lookup(id, p);
    if (r && !state.discovered.has(r)) out.add(p);
  }
  return out;
}

// The held ingredient: the one being dragged, or a lone item waiting in the bowl.
function glowSource() {
  if (drag && drag.started) return drag.id;
  const filled = state.bowl.filter(Boolean);
  if (filled.length === 1 && !state.busy && !state.pending) return filled[0];
  return null;
}

function refreshGlow() {
  const src = glowSource();
  const partners = src ? partnersOf(src) : new Set();
  pantryGrid.querySelectorAll('.tile').forEach(t => t.classList.toggle('partner', partners.has(t.dataset.id)));
}

function scrollTileIntoView(tile) {
  const smooth = reducedMotion.matches ? 'auto' : 'smooth';
  if (landscapeMQ.matches) {
    const top = tile.offsetTop - pantryGrid.clientHeight / 2 + tile.offsetHeight / 2;
    pantryGrid.scrollTo({ top: Math.max(0, top), behavior: smooth });
  } else {
    const left = tile.offsetLeft - pantryGrid.clientWidth / 2 + tile.offsetWidth / 2;
    pantryGrid.scrollTo({ left: Math.max(0, left), behavior: smooth });
  }
}

function markSeen(id) {
  if (!state.unseen.delete(id)) return;
  const badge = findTile(id)?.querySelector('.new');
  if (badge) badge.remove();
  save();
}

function renderCounter(bump = false) {
  countPill.textContent = `${state.discovered.size}/${TOTAL}`;
  btnBook.setAttribute('aria-label', `Open recipe book. Discovered ${state.discovered.size} of ${TOTAL}.`);
  if (bump) {
    btnBook.classList.remove('bump');
    void btnBook.offsetWidth;
    btnBook.classList.add('bump');
  }
}

/* =====================================================================
   Ghosts (dragged / flying items)
   ===================================================================== */
const GHOST = 72;
const ghostT = (x, y, r, s) => `translate3d(${x}px,${y}px,0) rotate(${r}deg) scale(${s})`;

function makeGhost(id, rect, big = false) {
  const g = el('div', 'ghost' + (big ? ' big' : ''));
  g.appendChild(el('span', 'emo', ITEMS[id].emoji));
  document.body.appendChild(g);
  placeGhost(g, rect.left + rect.width / 2 - GHOST / 2, rect.top + rect.height / 2 - GHOST / 2, 0, 1);
  return g;
}

function placeGhost(g, x, y, r = 0, s = 1) {
  g._x = x; g._y = y; g._r = r; g._s = s;
  g.style.transform = ghostT(x, y, r, s);
}

async function flyGhost(g, rect, { duration = 260, endScale = .75, arc = false, easing = 'cubic-bezier(.45,0,.2,1)' } = {}) {
  const tx = rect.left + rect.width / 2 - GHOST / 2;
  const ty = rect.top + rect.height / 2 - GHOST / 2;
  const frames = [{ transform: ghostT(g._x, g._y, g._r, g._s) }];
  if (arc) {
    const mx = (g._x + tx) / 2, my = Math.min(g._y, ty) - 70;
    frames.push({ transform: ghostT(mx, my, 0, 1.2), offset: .5 });
  }
  frames.push({ transform: ghostT(tx, ty, 0, endScale) });
  await anim(g, frames, { duration: reducedMotion.matches ? Math.min(duration, 150) : duration, easing, fill: 'forwards' });
  g.remove();
}

async function snapBack(g, id, fallbackTile) {
  const tile = findTile(id) || fallbackTile;
  const rect = tile && tile.isConnected ? tile.getBoundingClientRect() : null;
  Sound.boing();
  if (rect) await flyGhost(g, rect, { duration: 420, endScale: 1, easing: 'cubic-bezier(.34,1.56,.64,1)' });
  else g.remove();
  if (tile) {
    tile.classList.remove('lifted');
    tile.classList.remove('arrive');
    void tile.offsetWidth;
    tile.classList.add('arrive');
  }
}

/* =====================================================================
   Drag & drop controller (pointer events: mouse, touch, pen)
   ===================================================================== */
let drag = null;

function isOverDrop(x, y) {
  const r = dropzone.getBoundingClientRect();
  const pad = 24;
  return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
}

function onPantryDown(e) {
  if (e.button > 0 || drag) return;
  const tile = e.target.closest('.tile');
  if (!tile) return;
  Sound.ensure();
  dismissCoach();
  drag = {
    id: tile.dataset.id,
    tile,
    pid: e.pointerId,
    type: e.pointerType,
    sx: e.clientX, sy: e.clientY,
    lx: e.clientX, lt: performance.now(),
    started: false, ghost: null, over: false, rot: 0,
  };
  try { tile.setPointerCapture(e.pointerId); } catch (err) { /* not critical */ }
}

function startDrag() {
  drag.started = true;
  drag.ghost = makeGhost(drag.id, drag.tile.getBoundingClientRect());
  drag.tile.classList.add('lifted');
  markSeen(drag.id);
  Sound.pop();
  refreshGlow();
}

function onPointerMove(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.started) {
    const dist = Math.hypot(dx, dy);
    if (dist < (drag.type === 'mouse' ? 5 : 10)) return;
    // On touch, movement along the pantry's scroll axis is a scroll, not a drag.
    if (drag.type !== 'mouse' && dist < 26) {
      const alongScroll = landscapeMQ.matches ? Math.abs(dy) > Math.abs(dx) * 1.2 : Math.abs(dx) > Math.abs(dy) * 1.2;
      if (alongScroll) return;
    }
    startDrag();
  }
  if (e.cancelable) e.preventDefault();
  const now = performance.now();
  const vx = (e.clientX - drag.lx) / Math.max(1, now - drag.lt) * 16;
  drag.lx = e.clientX;
  drag.lt = now;
  drag.rot += (clamp(vx * 1.6, -22, 22) - drag.rot) * .3;
  const lift = drag.type === 'touch' ? 30 : 0; // keep the item visible above the finger
  placeGhost(drag.ghost, e.clientX - GHOST / 2, e.clientY - GHOST / 2 - lift, drag.rot, 1.15);
  const over = isOverDrop(e.clientX, e.clientY - lift);
  if (over !== drag.over) {
    drag.over = over;
    dropzone.classList.toggle('hover', over);
    if (over) Sound.tap();
  }
}

function onPointerEnd(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag;
  drag = null;
  dropzone.classList.remove('hover');
  try { d.tile.releasePointerCapture(d.pid); } catch (err) { /* ignore */ }

  if (!d.started) {
    if (e.type === 'pointerup') tapAdd(d.id, d.tile);
    flushRender();
    return;
  }
  refreshGlow();
  const lift = d.type === 'touch' ? 30 : 0;
  const dropped = e.type === 'pointerup' && isOverDrop(e.clientX, e.clientY - lift) && addToBowl(d.id, d.ghost, d.tile, false);
  if (dropped) flushRender();
  else snapBack(d.ghost, d.id, d.tile).then(flushRender);
}

function cancelDrag() {
  if (!drag) return;
  const d = drag;
  drag = null;
  dropzone.classList.remove('hover');
  if (d.ghost) d.ghost.remove();
  d.tile.classList.remove('lifted');
  flushRender();
  refreshGlow();
}

/* =====================================================================
   Bowl logic
   ===================================================================== */
function canAdd() {
  return !state.busy && state.bowl.includes(null);
}

function rejectFeedback() {
  Sound.boing();
  dropzone.classList.remove('reject');
  void dropzone.offsetWidth;
  dropzone.classList.add('reject');
  setCaption('Hold your whisks — still cooking! ⏳', true, 1400);
}

function tapAdd(id, tile) {
  markSeen(id);
  if (!canAdd()) { rejectFeedback(); return; }
  Sound.pop();
  addToBowl(id, makeGhost(id, tile.getBoundingClientRect()), tile, true);
}

function addToBowl(id, ghost, tile, arc) {
  const i = state.bowl.indexOf(null);
  if (state.busy || i < 0) { rejectFeedback(); return false; }
  state.bowl[i] = id;
  state.pending++;
  if (!state.bowl.includes(null)) state.busy = true;
  if (tile) tile.classList.remove('lifted');
  const target = slotEls[i].getBoundingClientRect();
  flyGhost(ghost, target, arc ? { arc: true, duration: 440 } : { duration: 190 }).then(() => {
    state.pending--;
    renderSlot(i);
    squish();
    Sound.drop();
    updateLiquid();
    updateEmptyBtn();
    refreshGlow();
    if (state.pending === 0 && !state.bowl.includes(null)) setTimeout(mix, 260);
    else bowlCaption();
  });
  return true;
}

function renderSlot(i) {
  const s = slotEls[i];
  const id = state.bowl[i];
  s.className = 'slot';
  s.replaceChildren();
  if (!id) {
    s.appendChild(el('span', 'plus', '+'));
    s.setAttribute('aria-label', `Empty slot ${i + 1}`);
    return;
  }
  const it = ITEMS[id];
  s.classList.add('filled', ...itemClasses(id));
  s.append(el('span', 'emo', it.emoji), el('span', 'lbl', it.name));
  s.setAttribute('aria-label', `${it.name} in the bowl. Press to take it out.`);
}

function removeFromSlot(i) {
  const id = state.bowl[i];
  if (!id || state.busy || state.pending) return;
  const rect = slotEls[i].getBoundingClientRect();
  state.bowl[i] = null;
  renderSlot(i);
  updateLiquid();
  updateEmptyBtn();
  refreshGlow();
  bowlCaption();
  Sound.pop();
  const tile = findTile(id);
  const g = makeGhost(id, rect);
  if (tile) {
    flyGhost(g, tile.getBoundingClientRect(), { arc: true, duration: 380, endScale: 1 }).then(() => {
      tile.classList.remove('arrive');
      void tile.offsetWidth;
      tile.classList.add('arrive');
    });
  } else {
    anim(g, [{ opacity: 1, transform: g.style.transform }, { opacity: 0, transform: g.style.transform + ' scale(.3)' }], { duration: 250, fill: 'forwards' }).then(() => g.remove());
  }
}

function clearBowl() {
  state.bowl = [null, null];
  renderSlot(0);
  renderSlot(1);
  updateEmptyBtn();
  refreshGlow();
}

function updateEmptyBtn() {
  btnEmpty.hidden = state.busy || !state.bowl.some(Boolean);
}

function updateLiquid(forceColor) {
  const color = forceColor || mixColors(state.bowl.filter(Boolean).map(id => ITEMS[id].color));
  bowlWrap.classList.toggle('has-liquid', !!color);
  if (color) bowlWrap.style.setProperty('--liquid', color);
}

function squish() {
  bowlSvg.classList.remove('squish');
  void bowlSvg.getBoundingClientRect();
  bowlSvg.classList.add('squish');
}
bowlSvg.addEventListener('animationend', e => { if (e.animationName === 'squish') bowlSvg.classList.remove('squish'); });

let faceTimer = 0;
function setFace(face, revertMs = 0) {
  clearTimeout(faceTimer);
  bowlWrap.dataset.face = face;
  if (revertMs) faceTimer = setTimeout(() => { if (!state.mixing) bowlWrap.dataset.face = 'idle'; }, revertMs);
}

function bowlCenter() {
  const r = bowlWrap.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height * .38 };
}

/* =====================================================================
   Mixing & discovery
   ===================================================================== */
let resultToken = 0;

async function mix() {
  if (state.mixing) return;
  const [a, b] = state.bowl;
  if (!a || !b) { state.busy = false; return; }
  state.mixing = true;
  state.busy = true;
  updateEmptyBtn();
  try {
    station.classList.add('cooking');
    setFace('wow');
    setCaption(`Mixing ${ITEMS[a].name} + ${ITEMS[b].name}… 🥄`);
    Sound.stir();
    await wait(reducedMotion.matches ? 450 : 1050);

    const res = lookup(a, b);
    state.stats.mixes++;
    station.classList.remove('cooking');
    clearBowl();
    const c = bowlCenter();

    if (!res) {
      const [emo, quip] = FAIL_QUIPS[(Math.random() * FAIL_QUIPS.length) | 0];
      updateLiquid('#c9b8a6');
      Sound.nope();
      FX.puff(c.x, c.y);
      setFace('meh', 1800);
      dropzone.classList.remove('reject');
      void dropzone.offsetWidth;
      dropzone.classList.add('reject');
      setCaption(`${ITEMS[a].name} + ${ITEMS[b].name}… nothing. Try another combo!`);
      toast({ emoji: emo, title: quip, text: `${ITEMS[a].name} + ${ITEMS[b].name} isn't a recipe. Keep experimenting!`, kind: 'meh', duration: 2600 });
      save();
      setTimeout(() => { if (!state.bowl.some(Boolean)) updateLiquid(); }, 900);
      return;
    }

    const item = ITEMS[res];
    const isNew = !state.discovered.has(res);
    const token = ++resultToken;
    updateLiquid(item.color);
    Sound.ovenDing();
    showResult(res, isNew);
    setCaption(`${ITEMS[a].emoji} ${ITEMS[a].name} + ${ITEMS[b].emoji} ${ITEMS[b].name} = ${item.emoji} ${item.name}`);

    if (isNew) {
      if (item.kind === 'mishap') {
        state.stats.mishaps++;
        Sound.splat();
        FX.splat(c.x, c.y, item.color);
        setFace('dizzy', 2200);
      } else {
        setTimeout(() => Sound.magic(), 140);
        FX.sparkle(c.x, c.y, item.emoji);
        setFace('happy', 2200);
      }
      discover(res);
      toastDiscovery(item);
      finishNewResult(res, token);
    } else {
      FX.mini(c.x, c.y);
      setFace('happy', 1500);
      toast({ emoji: item.emoji, title: `${item.name} again!`, text: 'Already in your recipe book. Tasty, though.', kind: 'info', duration: 1800 });
      setTimeout(() => { if (token === resultToken) hideResult(); }, 1300);
    }
    save();
    await wait(650); // let the reveal land before accepting new ingredients
  } finally {
    station.classList.remove('cooking');
    state.mixing = false;
    state.busy = false;
    state.pending = 0;
    updateEmptyBtn();
    refreshGlow();
    setTimeout(() => { if (!state.bowl.some(Boolean) && !state.mixing) updateLiquid(); }, 1400);
  }
}

function showResult(id, isNew) {
  const it = ITEMS[id];
  resultEmo.textContent = it.emoji;
  resultName.textContent = it.name;
  resultPop.className = 'result-pop ' + itemClasses(id).join(' ') + (isNew ? ' new' : '');
  resultPop.hidden = false;
  void resultPop.offsetWidth;
  resultPop.classList.add('show');
}

function hideResult() {
  if (resultPop.hidden) return;
  resultPop.classList.remove('show');
  resultPop.classList.add('leave');
  setTimeout(() => { if (resultPop.classList.contains('leave')) resultPop.hidden = true; }, 300);
}

async function finishNewResult(id, token) {
  await wait(reducedMotion.matches ? 700 : 1400);
  if (token !== resultToken) return;
  const tile = findTile(id);
  try {
    if (!tile || resultPop.hidden) { hideResult(); return; }
    scrollTileIntoView(tile);
    await wait(260);
    if (token !== resultToken) return;
    const g = makeGhost(id, resultEmo.getBoundingClientRect(), true);
    resultPop.hidden = true;
    await flyGhost(g, tile.getBoundingClientRect(), { arc: true, duration: 650, endScale: .7 });
    tile.classList.remove('incoming');
    tile.classList.add('arrive');
    Sound.pop();
    const r = tile.getBoundingClientRect();
    FX.mini(r.left + r.width / 2, r.top + r.height / 2);
  } finally {
    if (tile) tile.classList.remove('incoming');
    checkComplete();
  }
}

function discover(id) {
  state.discovered.add(id);
  state.order.push(id);
  state.unseen.add(id);
  if (state.hint.target === id) state.hint = { target: null, level: 0 };
  if (!matchesFilter(id, state.filter)) state.filter = 'all';
  renderChips();
  renderPantry({ incoming: id });
  renderCounter(true);
  if (!book.hidden) renderBook();
  save();
}

function toastDiscovery(item) {
  const kind = item.kind === 'mishap' ? 'mishap' : item.kind === 'legendary' ? 'legend' : 'new';
  const tag = item.kind === 'mishap' ? 'MISHAP' : item.kind === 'legendary' ? 'LEGENDARY' : item.kind === 'wacky' ? 'WACKY' : 'NEW';
  toast({ emoji: item.emoji, title: `New Discovery: ${item.name}!`, text: item.desc, kind, tag, duration: 4200 });
}

function checkComplete() {
  if (state.completed || state.discovered.size < TOTAL) return;
  state.completed = true;
  save();
  setTimeout(() => {
    Sound.fanfare();
    FX.confetti();
    setFace('happy', 3000);
    toast({ emoji: '🎉', title: MODE.text.completeTitle, text: MODE.text.completeText(TOTAL), kind: 'legend', tag: '100%', duration: 6000 });
  }, 400);
}

/* =====================================================================
   Hints
   ===================================================================== */
function giveHint() {
  Sound.ensure();
  const has = id => state.discovered.has(id);
  const cands = RECIPES.filter(([a, b, r]) => has(a) && has(b) && !has(r));
  if (!cands.length) {
    toast({ emoji: '🏆', title: 'No hints left!', text: 'You\'ve already found everything this kitchen can make.', kind: 'legend' });
    return;
  }
  let cur = state.hint.target && cands.find(c => c[2] === state.hint.target);
  if (!cur) {
    const minTier = Math.min(...cands.map(c => ITEMS[c[2]].tier));
    const pool = cands.filter(c => ITEMS[c[2]].tier === minTier);
    cur = pool[(Math.random() * pool.length) | 0];
    state.hint = { target: cur[2], level: 0 };
  }
  state.hint.level++;
  const [a, b] = cur;
  if (state.filter !== 'all') { state.filter = 'all'; renderChips(); renderPantry(); }
  const highlight = state.hint.level === 1 ? [a] : [a, b];
  pantryGrid.querySelectorAll('.tile.hint').forEach(t => t.classList.remove('hint'));
  highlight.forEach(id => {
    const t = findTile(id);
    if (t) { void t.offsetWidth; t.classList.add('hint'); }
  });
  const first = findTile(a);
  if (first) scrollTileIntoView(first);
  Sound.tap();
  if (state.hint.level === 1) {
    toast({ emoji: '💡', title: 'Psst… a hint!', text: `${ITEMS[a].emoji} ${ITEMS[a].name} has a secret. Try mixing it with something! (Tap 💡 again for more.)`, kind: 'info', duration: 4000 });
  } else {
    toast({ emoji: '💡', title: 'Big hint!', text: `Try ${ITEMS[a].emoji} ${ITEMS[a].name} + ${ITEMS[b].emoji} ${ITEMS[b].name}.`, kind: 'info', duration: 4000 });
  }
}

/* =====================================================================
   Recipe book
   ===================================================================== */
let lastFocus = null;

function renderBook() {
  const n = state.discovered.size;
  const countEl = $('#bookCount');
  countEl.replaceChildren(document.createTextNode('Discovered '), el('strong', null, String(n)), document.createTextNode(` / ${TOTAL}`));
  $('#bookBar').style.width = (n / TOTAL * 100).toFixed(1) + '%';
  $('#bookStats').textContent = `🥣 ${state.stats.mixes} mixes · 🤪 ${state.stats.mishaps} mishaps`;

  bookTabs.replaceChildren(...FILTERS.map(f => {
    const all = IDS.filter(id => matchesFilter(id, f.k));
    const got = all.filter(id => state.discovered.has(id)).length;
    const b = el('button', 'chip', f.l);
    b.appendChild(el('span', 'n', `${got}/${all.length}`));
    b.setAttribute('aria-pressed', String(state.bookTab === f.k));
    b.addEventListener('click', () => { Sound.tap(); state.bookTab = f.k; renderBook(); });
    return b;
  }));

  const has = id => state.discovered.has(id);
  bookGrid.replaceChildren(...bookOrder.filter(id => matchesFilter(id, state.bookTab)).map(id => {
    const it = ITEMS[id];
    const known = has(id);
    const card = el('button', 'card ' + (known ? itemClasses(id).join(' ') : 'locked'));
    card.dataset.id = id;
    card.append(el('span', 'emo', it.emoji), el('span', 'lbl', known ? it.name : '???'));
    if (!known) {
      card.appendChild(el('span', 'tier', 'T' + it.tier));
      if (RECIPES.some(([a, b, r]) => r === id && has(a) && has(b))) card.classList.add('ready');
      card.setAttribute('aria-label', `Undiscovered tier ${it.tier} item`);
    } else {
      card.setAttribute('aria-label', it.name);
    }
    if (known && state.unseen.has(id)) card.appendChild(el('span', 'new', ''));
    return card;
  }));
}

function eqNode(a, b) {
  const has = id => state.discovered.has(id);
  const part = id => {
    const s = el('span');
    if (has(id)) s.append(el('span', 'emo', ITEMS[id].emoji), document.createTextNode(ITEMS[id].name));
    else s.textContent = '???';
    return s;
  };
  const row = el('div', 'eq');
  row.append(part(a), el('span', 'plus', '+'), part(b));
  return row;
}

function showDetail(id) {
  const it = ITEMS[id];
  const known = state.discovered.has(id);
  const has = x => state.discovered.has(x);
  const dEmo = $('#dEmo');
  dEmo.textContent = it.emoji;
  dEmo.classList.toggle('locked', !known);
  $('#dName').textContent = known ? it.name : '???';
  const tag = $('#dTag');
  tag.className = 'tag ' + (known ? itemClasses(id).join(' ') : 'locked');
  tag.textContent = known ? `Tier ${it.tier} · ${KIND_LABEL[it.kind]}` : `Tier ${it.tier} · Undiscovered`;

  const made = $('#dMade');
  const uses = $('#dUses');
  made.replaceChildren();
  uses.replaceChildren();
  const sources = RECIPES.filter(r => r[2] === id);

  if (!known) {
    const ready = sources.some(([a, b]) => has(a) && has(b));
    $('#dDesc').textContent = ready
      ? '✨ You already have everything you need for this one. Keep mixing!'
      : 'A mystery waiting in the oven. Discover more ingredients to unlock it.';
  } else {
    $('#dDesc').textContent = it.desc;
    if (it.kind === 'base') {
      made.append(el('h4', null, 'Origin'), el('div', 'eq', 'A starting ingredient — always in stock!'));
    } else {
      made.appendChild(el('h4', null, sources.length > 1 ? 'Recipes' : 'Recipe'));
      sources.forEach(([a, b]) => made.appendChild(eqNode(a, b)));
    }
    const usedIn = RECIPES.filter(([a, b]) => a === id || b === id);
    if (usedIn.length) {
      uses.appendChild(el('h4', null, 'Used in'));
      const wrap = el('div', 'uses');
      const seen = new Set();
      let secret = 0;
      usedIn.forEach(([, , r]) => {
        if (seen.has(r)) return;
        seen.add(r);
        if (has(r)) {
          const s = el('span');
          s.append(el('span', 'emo', ITEMS[r].emoji), document.createTextNode(ITEMS[r].name));
          wrap.appendChild(s);
        } else secret++;
      });
      if (secret) wrap.appendChild(el('span', null, `+ ${secret} secret recipe${secret > 1 ? 's' : ''}`));
      uses.appendChild(wrap);
    }
    markSeen(id);
  }
  detail.hidden = false;
  detail.scrollTop = 0;
  $('#detailBack').focus({ preventScroll: true });
}

function hideDetail() {
  if (detail.hidden) return;
  detail.hidden = true;
  renderBook();
}

function openBook() {
  Sound.ensure();
  Sound.tap();
  dismissCoach();
  cancelDrag();
  lastFocus = document.activeElement;
  hideDetail();
  renderBook();
  book.classList.remove('closing');
  book.hidden = false;
  $('#bookClose').focus({ preventScroll: true });
}

function closeBook() {
  if (book.hidden || book.classList.contains('closing')) return;
  Sound.tap();
  book.classList.add('closing');
  disarmReset();
  setTimeout(() => {
    book.hidden = true;
    book.classList.remove('closing');
    detail.hidden = true;
  }, reducedMotion.matches ? 20 : 250);
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}

let resetTimer = 0;
function disarmReset() {
  clearTimeout(resetTimer);
  btnReset.classList.remove('armed');
  btnReset.textContent = 'Reset progress';
}

function onReset() {
  if (!btnReset.classList.contains('armed')) {
    Sound.boing();
    btnReset.classList.add('armed');
    btnReset.textContent = 'Tap again to erase everything';
    resetTimer = setTimeout(disarmReset, 3500);
    return;
  }
  disarmReset();
  Store.clear(MODE.storeKey);
  resetState();
  clearBowl();
  hideResult();
  state.filter = 'all';
  state.bookTab = 'all';
  save();
  renderChips();
  renderPantry();
  renderCounter(true);
  renderBook();
  bowlCaption();
  setFace('meh', 1500);
  FX.puff(window.innerWidth / 2, window.innerHeight / 2);
  Sound.nope();
  toast({ emoji: '🧽', title: 'Kitchen scrubbed clean!', text: MODE.text.resetText, kind: 'meh' });
}

/* =====================================================================
   Kitchen modes
   ===================================================================== */
function applyBranding() {
  document.documentElement.dataset.mode = state.mode;
  $('#brandLogo').textContent = MODE.logo;
  $('#brandMode').textContent = MODE.name;
  btnMode.setAttribute('aria-label', `The Kitchen Lab, ${MODE.name}. Switch kitchen.`);
  document.title = `The Kitchen Lab: ${MODE.name}`;
}

function modeProgress(key) {
  const m = MODES[key];
  const total = Object.keys(m.items).length;
  if (key === state.mode) return [state.discovered.size, total];
  const found = new Set(m.starters);
  const d = Store.read(m.storeKey);
  if (d && Array.isArray(d.discovered)) d.discovered.forEach(id => { if (m.items[id]) found.add(id); });
  return [found.size, total];
}

function renderModePicker() {
  modeList.replaceChildren(...Object.values(MODES).map(m => {
    const [n, total] = modeProgress(m.key);
    const card = el('button', 'mode-card' + (m.key === state.mode ? ' active' : ''));
    card.dataset.mode = m.key;
    const title = el('b', null, m.name);
    if (m.key === state.mode) title.appendChild(el('span', 'mc-now', 'PLAYING'));
    const text = el('span', 'mc-text');
    text.append(title, el('small', null, m.blurb));
    card.append(el('span', 'emo', m.logo), text, el('span', 'mc-prog', `${n} / ${total}`));
    card.setAttribute('aria-label', `${m.name}: ${n} of ${total} discovered${m.key === state.mode ? ', currently playing' : ''}`);
    return card;
  }));
}

function openModePicker() {
  Sound.ensure();
  Sound.tap();
  dismissCoach();
  cancelDrag();
  lastFocus = document.activeElement;
  renderModePicker();
  modePicker.classList.remove('closing');
  modePicker.hidden = false;
  const active = modeList.querySelector('.mode-card.active');
  if (active) active.focus({ preventScroll: true });
}

function closeModePicker(silent = false) {
  if (modePicker.hidden || modePicker.classList.contains('closing')) return;
  if (!silent) Sound.tap();
  modePicker.classList.add('closing');
  setTimeout(() => {
    modePicker.hidden = true;
    modePicker.classList.remove('closing');
  }, reducedMotion.matches ? 20 : 250);
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}

function switchMode(key) {
  if (!MODES[key]) return;
  if (key === state.mode) { closeModePicker(); return; }
  if (state.busy || state.mixing || state.pending) {
    closeModePicker(true);
    rejectFeedback();
    return;
  }
  cancelDrag();
  dismissCoach();
  resultToken++;
  resultPop.hidden = true;
  clearBowl();
  updateLiquid();
  state.mode = key;
  setModeData(key);
  const returning = loadState();
  state.filter = 'all';
  state.bookTab = 'all';
  applyBranding();
  renderChips();
  renderPantry();
  renderCounter(true);
  bowlCaption();
  savePrefs();
  closeModePicker(true);
  squish();
  setFace('happy', 1200);
  Sound.pop();
  const c = bowlCenter();
  FX.mini(c.x, c.y);
  if (returning && state.discovered.size > STARTERS.length) {
    toast({ emoji: MODE.logo, title: MODE.text.backTitle, text: `${MODE.name}: ${state.discovered.size} of ${TOTAL} discovered.`, kind: 'info', duration: 2600 });
  } else {
    toast({ emoji: MODE.logo, title: MODE.text.welcomeTitle, text: MODE.text.welcomeText, kind: 'info', duration: 4200 });
  }
}

/* =====================================================================
   First-run coach
   ===================================================================== */
let coachEl = null;
function showCoach() {
  if (state.stats.mixes > 0 || state.bowl.some(Boolean) || state.pending || reducedMotion.matches) return;
  const tile = findTile(STARTERS[0]);
  if (!tile) return;
  tile.classList.add('coach');
  const from = tile.getBoundingClientRect();
  const to = dropzone.getBoundingClientRect();
  const hand = el('div', 'coach-hand emo', '👆');
  document.body.appendChild(hand);
  coachEl = hand;
  const T = (x, y, s = 1) => `translate(${x - 16}px, ${y - 6}px) scale(${s})`;
  const fx = from.left + from.width / 2, fy = from.top + from.height / 2;
  const tx = to.left + to.width / 2, ty = to.top + to.height * .55;
  anim(hand, [
    { transform: T(fx, fy), opacity: 0 },
    { transform: T(fx, fy, .9), opacity: 1, offset: .15 },
    { transform: T(tx, ty, .9), opacity: 1, offset: .75 },
    { transform: T(tx, ty), opacity: 0 },
  ], { duration: 1800, iterations: 3, easing: 'ease-in-out', fill: 'forwards' }).then(dismissCoach);
}

function dismissCoach() {
  if (coachEl) { coachEl.remove(); coachEl = null; }
  pantryGrid.querySelectorAll('.tile.coach').forEach(t => t.classList.remove('coach'));
}

/* =====================================================================
   Settings UI
   ===================================================================== */
function renderSettings() {
  btnMusic.classList.toggle('off', !state.settings.music);
  btnMusic.setAttribute('aria-pressed', String(state.settings.music));
  btnSfx.classList.toggle('off', !state.settings.sfx);
  btnSfx.setAttribute('aria-pressed', String(state.settings.sfx));
  btnSfx.querySelector('.emo').textContent = state.settings.sfx ? '🔊' : '🔇';
}

/* =====================================================================
   Error handling
   ===================================================================== */
let lastErrorToast = 0;
function recover(err) {
  console.error('[CookieLab]', err);
  try {
    cancelDrag();
    document.querySelectorAll('.ghost').forEach(g => g.remove());
    station.classList.remove('cooking');
    state.busy = false;
    state.mixing = false;
    state.pending = 0;
    clearBowl();
    updateLiquid();
    setFace('meh', 1500);
    if (Date.now() - lastErrorToast > 5000) {
      lastErrorToast = Date.now();
      toast({ emoji: '🧯', title: 'Kitchen hiccup!', text: 'Something went sideways, but your discoveries are safe. Carry on cooking!', kind: 'meh' });
    }
  } catch (e) { console.error('[CookieLab] recovery failed', e); }
}

/* =====================================================================
   Wiring
   ===================================================================== */
function init() {
  loadPrefs();
  setModeData(state.mode);
  const returning = loadState();
  applyBranding();
  Sound.setSfx(state.settings.sfx);
  FX.resize();
  renderSettings();
  renderChips();
  renderPantry();
  renderCounter();
  renderSlot(0);
  renderSlot(1);
  bowlCaption();

  pantryGrid.addEventListener('pointerdown', onPantryDown);
  pantryGrid.addEventListener('click', e => {
    // Keyboard activation (Enter/Space) arrives as a click with detail 0; pointer taps are handled on pointerup.
    const tile = e.target.closest('.tile');
    if (tile && e.detail === 0) tapAdd(tile.dataset.id, tile);
  });
  pantryGrid.addEventListener('contextmenu', e => e.preventDefault());
  pantryGrid.addEventListener('dragstart', e => e.preventDefault());
  window.addEventListener('pointermove', onPointerMove, { passive: false });
  window.addEventListener('pointerup', onPointerEnd);
  window.addEventListener('pointercancel', onPointerEnd);
  window.addEventListener('blur', cancelDrag);

  slotEls.forEach((s, i) => s.addEventListener('click', () => removeFromSlot(i)));
  btnEmpty.addEventListener('click', () => { removeFromSlot(1); removeFromSlot(0); });
  bowlWrap.addEventListener('click', () => {
    if (state.busy) return;
    Sound.ensure();
    squish();
    Sound.boing();
    setFace('happy', 700);
  });

  btnBook.addEventListener('click', openBook);
  btnHint.addEventListener('click', giveHint);
  btnMusic.addEventListener('click', () => {
    state.settings.music = !state.settings.music;
    Sound.setMusic(state.settings.music);
    renderSettings();
    savePrefs();
    toast({ emoji: '🎵', title: state.settings.music ? 'Kitchen tunes on' : 'Kitchen tunes off', kind: 'info', duration: 1400 });
  });
  btnSfx.addEventListener('click', () => {
    state.settings.sfx = !state.settings.sfx;
    Sound.setSfx(state.settings.sfx);
    Sound.tap();
    renderSettings();
    savePrefs();
  });

  book.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeBook(); });
  btnMode.addEventListener('click', openModePicker);
  modePicker.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) { closeModePicker(); return; }
    const card = e.target.closest('.mode-card');
    if (card) switchMode(card.dataset.mode);
  });
  bookGrid.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (!card) return;
    Sound.tap();
    if (card.classList.contains('locked')) {
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
    showDetail(card.dataset.id);
  });
  $('#detailBack').addEventListener('click', () => { Sound.tap(); hideDetail(); });
  btnReset.addEventListener('click', onReset);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!modePicker.hidden) closeModePicker();
      else if (!book.hidden) { if (!detail.hidden) hideDetail(); else closeBook(); }
      else cancelDrag();
    }
    const openModal = !modePicker.hidden ? modePicker : !book.hidden ? book : null;
    if (e.key === 'Tab' && openModal) {
      // keep focus inside the open dialog
      const scope = openModal === book && !detail.hidden ? detail : openModal;
      const f = [...scope.querySelectorAll('button')].filter(b => b.offsetParent !== null);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });

  // Audio can only start after a user gesture.
  const unlock = () => {
    if (!Sound.ensure()) return;
    if (state.settings.music) Sound.setMusic(true);
    document.removeEventListener('pointerdown', unlock, true);
    document.removeEventListener('keydown', unlock, true);
  };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('keydown', unlock, true);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelDrag(); Sound.suspend(); } else Sound.resume();
  });

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    dismissCoach();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(FX.resize, 120);
  });

  window.addEventListener('error', e => recover(e.error || e.message));
  window.addEventListener('unhandledrejection', e => recover(e.reason));

  setTimeout(() => {
    if (returning && state.discovered.size > STARTERS.length) {
      toast({ emoji: MODE.logo, title: MODE.text.backTitle, text: `You've discovered ${state.discovered.size} of ${TOTAL} creations. Tap the title to switch kitchens.`, kind: 'info', duration: 3200 });
    } else {
      toast({ emoji: MODE.logo, title: MODE.text.welcomeTitle, text: MODE.text.welcomeText, kind: 'info', duration: 4200 });
      setTimeout(showCoach, 900);
    }
  }, 350);

  if (!Store.ok) savePrefs(); // surface the storage warning once, early
}

try {
  init();
} catch (err) {
  console.error('[KitchenLab] failed to start', err);
  document.body.insertAdjacentHTML('beforeend',
    '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#fff4e6;font:18px system-ui;z-index:3000">🔥 The oven failed to start. Please reload the page.</div>');
}
})();
</script>
</body>
</html>
